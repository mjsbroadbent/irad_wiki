<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="146" viewBox="0 0 420 146" font-family="'DejaVu Sans', Arial, Helvetica, sans-serif">
<title>Religion in Irad (2018 estimate)</title>
<desc>Christianity 78%; Islam 18%; Other 4%</desc>
<rect x="0.5" y="0.5" width="419" height="145" fill="#f8f9fa" stroke="#a2a9b1"/>
<text x="210" y="26" font-size="14" font-weight="bold" text-anchor="middle" fill="#202122">Religion in Irad (2018 estimate)</text>
<text x="188" y="59" font-size="12.5" text-anchor="end" fill="#202122">Christianity</text>
<rect x="196" y="48" width="164.0" height="15" fill="#3366cc"/>
<text x="366.0" y="60" font-size="12.5" fill="#202122">78%</text>
<text x="188" y="83" font-size="12.5" text-anchor="end" fill="#202122">Islam</text>
<rect x="196" y="72" width="37.8" height="15" fill="#3366cc"/>
<text x="239.8" y="84" font-size="12.5" fill="#202122">18%</text>
<text x="188" y="107" font-size="12.5" text-anchor="end" fill="#202122">Other</text>
<rect x="196" y="96" width="8.4" height="15" fill="#3366cc"/>
<text x="210.4" y="108" font-size="12.5" fill="#202122">4%</text>
<text x="12" y="135" font-size="11" fill="#555555">Other: mainly Jews, Buddhists and Bahaʼis.</text>
</svg>
