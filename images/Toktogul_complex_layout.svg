<rect x="190" y="320" width="110" height="60" fill="#fff" stroke="#202122" stroke-width="1.3"/>
<line x1="200" y1="326" x2="200" y2="374" stroke="#8e44ad" stroke-width="1"/><line x1="222" y1="326" x2="222" y2="374" stroke="#8e44ad" stroke-width="1"/><line x1="244" y1="326" x2="244" y2="374" stroke="#8e44ad" stroke-width="1"/><line x1="266" y1="326" x2="266" y2="374" stroke="#8e44ad" stroke-width="1"/><line x1="288" y1="326" x2="288" y2="374" stroke="#8e44ad" stroke-width="1"/>
<line x1="196" y1="334" x2="294" y2="334" stroke="#8e44ad" stroke-width="1"/><line x1="196" y1="352" x2="294" y2="352" stroke="#8e44ad" stroke-width="1"/><line x1="196" y1="370" x2="294" y2="370" stroke="#8e44ad" stroke-width="1"/>
<text x="245.0" y="312.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">High-voltage switchyard</text><text x="245.0" y="312.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#202122">High-voltage switchyard</text>
<rect x="205" y="396" width="80" height="30" fill="#fff" stroke="#202122" stroke-width="1.3"/>
<text x="245.0" y="416.0" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">Dispatch center</text><text x="245.0" y="416.0" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#202122">Dispatch center</text>
<rect x="160" y="350" width="14" height="14" fill="#1f4e9a" stroke="#fff"/>
<text x="150.0" y="362.0" font-size="11" text-anchor="end" font-weight="normal" font-style="normal" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">Gendarmerie</text><text x="150.0" y="362.0" font-size="11" text-anchor="end" font-weight="normal" font-style="normal" fill="#202122">Gendarmerie</text>
<!-- export lines -->
<path d="M200,320 L120,150 L60,0" fill="none" stroke="#8e44ad" stroke-width="2"/>
<text x="70.0" y="70.0" font-size="11" text-anchor="start" font-weight="normal" font-style="italic" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">to Talas and the Chu</text><text x="70.0" y="70.0" font-size="11" text-anchor="start" font-weight="normal" font-style="italic" fill="#6c3483">to Talas and the Chu</text>
<path d="M190,380 L90,520 L40,620" fill="none" stroke="#8e44ad" stroke-width="2"/>
<text x="60.0" y="540.0" font-size="11" text-anchor="start" font-weight="normal" font-style="italic" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">to the Fergana Valley</text><text x="60.0" y="540.0" font-size="11" text-anchor="start" font-weight="normal" font-style="italic" fill="#6c3483">to the Fergana Valley</text>
<!-- State Route 1 and the bridge road -->
<path d="M330,0 C330,120 330,220 335,300 C340,360 300,420 250,480 C220,520 190,570 170,620" fill="none" stroke="#fff" stroke-width="7"/>
<path d="M330,0 C330,120 330,220 335,300 C340,360 300,420 250,480 C220,520 190,570 170,620" fill="none" stroke="#b5541b" stroke-width="4"/>
<text x="342.0" y="40.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">State Route 1 from the Fergana Gateway</text><text x="342.0" y="40.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#8a3d10">State Route 1 from the Fergana Gateway</text>
<text x="178.0" y="610.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">to Tash-Kömür</text><text x="178.0" y="610.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#8a3d10">to Tash-Kömür</text>
<path d="M338,420 C380,430 420,430 470,420 C540,405 620,380 690,350" fill="none" stroke="#b5541b" stroke-width="2.4" stroke-dasharray="6 3"/>
<line x1="440" y1="410" x2="458" y2="436" stroke="#202122" stroke-width="3"/><line x1="452" y1="406" x2="470" y2="432" stroke="#202122" stroke-width="3"/>
<text x="470.0" y="470.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">Naryn bridge</text><text x="470.0" y="470.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#202122">Naryn bridge</text>
<text x="470.0" y="485.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">crossings under UNMI escort</text><text x="470.0" y="485.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#202122">crossings under UNMI escort</text>
<rect x="326" y="414" width="12" height="12" fill="#1f4e9a" stroke="#fff" transform="rotate(45 332 420)"/>
<text x="322.0" y="448.0" font-size="11" text-anchor="end" font-weight="normal" font-style="normal" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">Gendarmerie checkpoint</text><text x="322.0" y="448.0" font-size="11" text-anchor="end" font-weight="normal" font-style="normal" fill="#202122">Gendarmerie checkpoint</text>
<!-- line and zone labels -->
<g transform="rotate(-81.7 392 190)"><text x="392.0" y="186.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">Qara-Chik Demarcation Line</text><text x="392.0" y="186.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#c0392b">Qara-Chik Demarcation Line</text></g>
<path d="M420,0 L330,620" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 4"/>
<text x="90.0" y="250.0" font-size="22" text-anchor="middle" font-weight="bold" font-style="normal" letter-spacing="4" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">ISEZ</text><text x="90.0" y="250.0" font-size="22" text-anchor="middle" font-weight="bold" font-style="normal" letter-spacing="4" fill="#9a6a3a">ISEZ</text>
<text x="820.0" y="470.0" font-size="22" text-anchor="middle" font-weight="bold" font-style="normal" letter-spacing="4" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">ATR</text><text x="820.0" y="470.0" font-size="22" text-anchor="middle" font-weight="bold" font-style="normal" letter-spacing="4" fill="#5f7d4e">ATR</text>
