<rect x="680" y="270" width="14" height="14" fill="#3f7d20" stroke="#fff"/>
<text x="700.0" y="282.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">El-Choro guard post</text><text x="700.0" y="282.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#202122">El-Choro guard post</text>
<!-- Kara-Köl -->
<rect x="700" y="340" width="9" height="7" fill="#9a8f80"/><rect x="716" y="332" width="9" height="7" fill="#9a8f80"/><rect x="728" y="350" width="9" height="7" fill="#9a8f80"/><rect x="710" y="356" width="9" height="7" fill="#9a8f80"/><rect x="744" y="338" width="9" height="7" fill="#9a8f80"/><rect x="736" y="364" width="9" height="7" fill="#9a8f80"/><rect x="720" y="372" width="9" height="7" fill="#9a8f80"/>
<text x="725.0" y="396.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">Kara-Köl</text><text x="725.0" y="396.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#202122">Kara-Köl</text>
<text x="725.0" y="411.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">operators’ town (tribal side)</text><text x="725.0" y="411.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#202122">operators’ town (tribal side)</text>
