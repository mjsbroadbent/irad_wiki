<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="'DejaVu Sans', Arial, Helvetica, sans-serif">
<title>Layout of the Toktogul Hydroelectric Complex</title>
<desc>Schematic plan of the complex since the 2009 protocol, all in the ISEZ: the dam and powerhouse (guarded by the El-Choro until 2009, now by the Gendarmerie), Kara-Köl downstream, the switchyard and dispatch center, the Naryn bridge checkpoint, State Route 1 and the export lines, with the Qara-Chik line on the slopes above the basin and the tribal pastures beyond it.</desc>
<defs>
<marker id="tk-ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0978ab"/></marker></defs>
<rect width="900" height="620" fill="#f4f1e8"/>
<rect width="900" height="620" fill="#fbe2c4" fill-opacity="0.7"/>
<!-- tribal mountains around the basin -->
<g fill="#dbe9d2"><path d="M0,0 H255 C250,80 225,150 170,200 C120,240 60,255 0,262 Z"/><path d="M900,160 C860,230 830,300 815,360 C805,420 835,470 900,500 Z"/><path d="M0,430 C50,440 90,480 105,620 H0 Z"/></g>
<!-- reservoir -->
<path d="M520,0 H900 V150 C820,180 760,200 700,215 C650,225 610,228 585,222 C560,200 545,120 520,0 Z" fill="#c6ecff" stroke="#0978ab" stroke-width="1"/>
<text x="740.0" y="80.0" font-size="14" text-anchor="middle" font-weight="normal" font-style="italic" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">Toktogul Reservoir</text><text x="740.0" y="80.0" font-size="14" text-anchor="middle" font-weight="normal" font-style="italic" fill="#2a5b8a">Toktogul Reservoir</text>
<text x="740.0" y="98.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="italic" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">about 19 km³</text><text x="740.0" y="98.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="italic" fill="#2a5b8a">about 19 km³</text>
<!-- river below the dam -->
<path d="M600,250 C560,300 520,340 470,380 C410,430 350,480 300,530 C260,570 225,600 200,620" fill="none" stroke="#0978ab" stroke-width="9" stroke-linecap="round" opacity="0.55"/>
<path d="M430,420 L400,445" stroke="#0978ab" stroke-width="1.6" marker-end="url(#tk-ah)"/>
<text x="250.0" y="590.0" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">Naryn</text><text x="250.0" y="590.0" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic" fill="#0978ab">Naryn</text>
<!-- dam and powerhouse -->
<path d="M560,212 Q600,240 648,214" fill="none" stroke="#5f6368" stroke-width="16" stroke-linecap="round"/>
<rect x="585" y="236" width="44" height="22" fill="#fff" stroke="#202122" stroke-width="1.3"/>
<rect x="589" y="241" width="7" height="12" fill="#2a7fc1"/><rect x="599" y="241" width="7" height="12" fill="#2a7fc1"/><rect x="609" y="241" width="7" height="12" fill="#2a7fc1"/><rect x="619" y="241" width="7" height="12" fill="#2a7fc1"/>
<text x="660.0" y="200.0" font-size="12" text-anchor="start" font-weight="bold" font-style="normal" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">Dam</text><text x="660.0" y="200.0" font-size="12" text-anchor="start" font-weight="bold" font-style="normal" fill="#202122">Dam</text>
<text x="660.0" y="215.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">concrete gravity, about 215 m high</text><text x="660.0" y="215.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#202122">concrete gravity, about 215 m high</text>
<text x="640.0" y="252.0" font-size="12" text-anchor="start" font-weight="bold" font-style="normal" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">Powerhouse: 4 units, 1,200 MW</text><text x="640.0" y="252.0" font-size="12" text-anchor="start" font-weight="bold" font-style="normal" fill="#202122">Powerhouse: 4 units, 1,200 MW</text>
