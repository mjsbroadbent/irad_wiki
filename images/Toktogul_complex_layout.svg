<g fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 4"><path d="M255,0 C250,80 225,150 170,200 C120,240 60,255 0,262"/><path d="M900,160 C860,230 830,300 815,360 C805,420 835,470 900,500"/><path d="M0,430 C50,440 90,480 105,620"/></g>
<rect x="808" y="372" width="12" height="12" fill="#c0392b" stroke="#fff" transform="rotate(45 814 378)"/>
