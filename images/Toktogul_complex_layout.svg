<text x="322.0" y="448.0" font-size="11" text-anchor="end" font-weight="normal" font-style="normal" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85">Gendarmerie checkpoint</text><text x="322.0" y="448.0" font-size="11" text-anchor="end" font-weight="normal" font-style="normal" fill="#202122">Gendarmerie checkpoint</text>
