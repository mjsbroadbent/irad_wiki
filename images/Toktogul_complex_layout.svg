<line x1="10" y1="34" x2="30" y2="34" stroke="#8e44ad" stroke-width="2"/><text x="38" y="38" font-size="11" fill="#202122">High-voltage line</text>
<rect x="160" y="28" width="12" height="12" fill="#1f4e9a"/><text x="178" y="38" font-size="11" fill="#202122">ISEZ Gendarmerie</text>
<rect x="10" y="50" width="12" height="12" fill="#3f7d20"/><text x="30" y="60" font-size="11" fill="#202122">El-Choro Militias</text>
<rect x="160" y="50" width="20" height="12" fill="#c0392b" fill-opacity="0.15"/><text x="186" y="60" font-size="11" fill="#202122">12 km restricted-weapons zone</text>
<text x="10" y="80" font-size="10.5" fill="#555555">Joint technical commission and UNMI supervise operation.</text></g>
<g transform="translate(860,40)"><path d="M0,14 L6,-8 L12,14 L6,9 Z" fill="#202122"/><text x="6" y="30" font-size="11" text-anchor="middle" fill="#202122">N</text></g>
</svg>
