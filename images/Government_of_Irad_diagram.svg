<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" font-family="'DejaVu Sans', Arial, Helvetica, sans-serif">
<title>Government of Irad since 2007</title>
<desc>The ISEZ: voters elect the Governor and Lieutenant Governor and the 60-seat Mejlis; the Governor appoints the cabinet and the mayors; the Supreme Court heads the courts. The ATR: 24 clans with councils of elders, the Kurultai and the Iradi Freedom Society. UNMI links the two through the Joint Liaison Committee and the Toktogul commission.</desc>
<defs><marker id="gov-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#54595d"/></marker></defs>
<rect width="920" height="600" fill="#fff"/>
<rect x="10" y="10" width="545" height="470" rx="4" fill="#fdf1e2" stroke="#d7b98e"/>
<text x="282" y="32" font-size="14" font-weight="bold" text-anchor="middle" fill="#202122">Irad Special Economic Zone (ISEZ)</text>
<text x="282" y="48" font-size="10.5" text-anchor="middle" fill="#555555">Organic Act of 1992 and territorial statutes, treated as still in force</text>
<rect x="197" y="62" width="170" height="34" rx="3" fill="#fff" stroke="#72777d" stroke-width="1.1"/>
<text x="282" y="80" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#202122">Voters of the ISEZ</text>

<line x1="232" y1="96" x2="115" y2="140" stroke="#54595d" stroke-width="1.3" marker-end="url(#gov-ah)"/><text x="167.5" y="122" font-size="10.5" font-style="italic" text-anchor="end" fill="#555555">elect every 4 years</text>
<line x1="332" y1="96" x2="450" y2="140" stroke="#54595d" stroke-width="1.3" marker-end="url(#gov-ah)"/><text x="397" y="122" font-size="10.5" font-style="italic" text-anchor="start" fill="#555555">elect every 4 years</text>
<rect x="25" y="142" width="190" height="64" rx="3" fill="#fff" stroke="#72777d" stroke-width="1.1"/>
<text x="120" y="160" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202122">Governor</text>
<text x="120" y="176" font-size="10.5" text-anchor="middle" fill="#555555">and Lieutenant Governor</text><text x="120" y="189" font-size="10.5" text-anchor="middle" fill="#555555">joint ticket, 4-year terms</text>
<rect x="355" y="142" width="185" height="64" rx="3" fill="#fff" stroke="#72777d" stroke-width="1.1"/>
<text x="447.5" y="160" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202122">Mejlis</text>
<text x="447.5" y="176" font-size="10.5" text-anchor="middle" fill="#555555">Territorial Legislature, 60 seats</text><text x="447.5" y="189" font-size="10.5" text-anchor="middle" fill="#555555">Legislative Hall, Talas</text>
<line x1="120" y1="206" x2="120" y2="248" stroke="#54595d" stroke-width="1.3" marker-end="url(#gov-ah)"/><text x="126" y="231" font-size="10.5" font-style="italic" text-anchor="start" fill="#555555">appoints</text>
<rect x="25" y="250" width="190" height="64" rx="3" fill="#fff" stroke="#72777d" stroke-width="1.1"/>
<text x="120" y="268" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202122">Cabinet</text>
<text x="120" y="284" font-size="10.5" text-anchor="middle" fill="#555555">ministers and department heads</text><text x="120" y="297" font-size="10.5" text-anchor="middle" fill="#555555">chaired by the Lt. Governor</text>
<line x1="120" y1="314" x2="120" y2="350" stroke="#54595d" stroke-width="1.3" marker-end="url(#gov-ah)"/>
<rect x="25" y="352" width="190" height="50" rx="3" fill="#fff" stroke="#72777d" stroke-width="1.1"/>
<text x="120" y="370" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202122">Internal Security</text>
<text x="120" y="386" font-size="10.5" text-anchor="middle" fill="#555555">ministry; Republican Gendarmerie</text>
<line x1="215" y1="172" x2="250" y2="268" stroke="#54595d" stroke-width="1.3" marker-end="url(#gov-ah)"/>
<rect x="235" y="270" width="140" height="64" rx="3" fill="#fff" stroke="#72777d" stroke-width="1.1"/>
<text x="305" y="288" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202122">Mayors</text>
<text x="305" y="304" font-size="10.5" text-anchor="middle" fill="#555555">of Talas, Nurzhan and</text><text x="305" y="317" font-size="10.5" text-anchor="middle" fill="#555555">Iyık Janyl (appointed)</text>
<rect x="395" y="250" width="145" height="64" rx="3" fill="#fff" stroke="#72777d" stroke-width="1.1"/>
<text x="467.5" y="268" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202122">Supreme Court</text>
<text x="467.5" y="284" font-size="10.5" text-anchor="middle" fill="#555555">Chief Justice and</text><text x="467.5" y="297" font-size="10.5" text-anchor="middle" fill="#555555">4 associate justices</text>
<line x1="467" y1="314" x2="467" y2="350" stroke="#54595d" stroke-width="1.3" marker-end="url(#gov-ah)"/>
<rect x="395" y="352" width="145" height="50" rx="3" fill="#fff" stroke="#72777d" stroke-width="1.1"/>
<text x="467.5" y="370" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202122">Lower courts</text>
<text x="467.5" y="386" font-size="10.5" text-anchor="middle" fill="#555555">district and municipal</text>
<rect x="235" y="352" width="140" height="64" rx="3" fill="#fff" stroke="#72777d" stroke-width="1.1"/>
<text x="305" y="370" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202122">Six districts</text>
<text x="305" y="386" font-size="10.5" text-anchor="middle" fill="#555555">Talas, Kara-Buura, Chu,</text><text x="305" y="399" font-size="10.5" text-anchor="middle" fill="#555555">Sary-Bulak, Toktogul,</text><text x="305" y="412" font-size="10.5" text-anchor="middle" fill="#555555">Lower Naryn</text>
<text x="282" y="440" font-size="10.5" text-anchor="middle" fill="#555555">De jure capital: Talas. Executive reported at Boz-Korgon since 2023.</text>
<text x="282" y="456" font-size="10.5" text-anchor="middle" fill="#555555">Ruling party: Democratic Party of Irad (DPI)</text>

<rect x="570" y="10" width="340" height="470" rx="4" fill="#e9f3e2" stroke="#a8c995"/>
<text x="740" y="32" font-size="14" font-weight="bold" text-anchor="middle" fill="#202122">Autonomous Tribal Regions (ATR)</text>
<text x="740" y="48" font-size="10.5" text-anchor="middle" fill="#555555">No formal government; customary law (adat)</text>
<rect x="605" y="62" width="270" height="50" rx="3" fill="#fff" stroke="#72777d" stroke-width="1.1"/>
<text x="740" y="80" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202122">24 clans (uruk)</text>
<text x="740" y="96" font-size="10.5" text-anchor="middle" fill="#555555">each governed by a council of elders (aksakals)</text>
<line x1="740" y1="112" x2="740" y2="142" stroke="#54595d" stroke-width="1.3" marker-end="url(#gov-ah)"/><text x="746" y="131" font-size="10.5" font-style="italic" text-anchor="start" fill="#555555">send delegates</text>
<rect x="605" y="144" width="270" height="50" rx="3" fill="#fff" stroke="#72777d" stroke-width="1.1"/>
<text x="740" y="162" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202122">Kurultai</text>
<text x="740" y="178" font-size="10.5" text-anchor="middle" fill="#555555">assembly of the clans; decides by consensus</text>
<line x1="740" y1="194" x2="740" y2="226" stroke="#54595d" stroke-width="1.3" marker-end="url(#gov-ah)"/>
<rect x="605" y="228" width="270" height="64" rx="3" fill="#fff" stroke="#72777d" stroke-width="1.1"/>
<text x="740" y="246" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202122">Iradi Freedom Society (IAC)</text>
<text x="740" y="262" font-size="10.5" text-anchor="middle" fill="#555555">consultative confederation formed 2007</text><text x="740" y="275" font-size="10.5" text-anchor="middle" fill="#555555">unofficial leader: Bektur Zhumabek uulu</text>
<rect x="605" y="312" width="130" height="64" rx="3" fill="#fff" stroke="#72777d" stroke-width="1.1"/>
<text x="670" y="330" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202122">Elder judges</text>
<text x="670" y="346" font-size="10.5" text-anchor="middle" fill="#555555">(biys) settle disputes</text><text x="670" y="359" font-size="10.5" text-anchor="middle" fill="#555555">by compensation (kun)</text>
<rect x="745" y="312" width="130" height="64" rx="3" fill="#fff" stroke="#72777d" stroke-width="1.1"/>
<text x="810" y="330" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202122">El-Choro Militias</text>
<text x="810" y="346" font-size="10.5" text-anchor="middle" fill="#555555">successors of the</text><text x="810" y="359" font-size="10.5" text-anchor="middle" fill="#555555">Popular Front</text>
<text x="740" y="440" font-size="10.5" text-anchor="middle" fill="#555555">The Organic Act and ISEZ courts are not recognized here.</text>

<rect x="200" y="500" width="520" height="88" rx="4" fill="#e3eef9" stroke="#8fb3d9"/>
<text x="460" y="522" font-size="13" font-weight="bold" text-anchor="middle" fill="#202122">United Nations Mission in Irad (UNMI), since October 2007</text>
<text x="460" y="542" font-size="10.5" text-anchor="middle" fill="#555555">monitors the Qara-Chik line; headquarters at Kara-Oi</text>
<text x="460" y="560" font-size="10.5" text-anchor="middle" fill="#555555">Joint Liaison Committee (ISEZ and ATR)</text>
<text x="460" y="576" font-size="10.5" text-anchor="middle" fill="#555555">Joint technical commission for the Toktogul complex (Naryn Water and Power Protocol)</text>
<line x1="282" y1="480" x2="282" y2="500" stroke="#54595d" stroke-width="1.3" stroke-dasharray="4 3"/>
<line x1="740" y1="480" x2="640" y2="500" stroke="#54595d" stroke-width="1.3" stroke-dasharray="4 3"/>
</svg>
