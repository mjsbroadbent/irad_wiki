<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="930" height="286" viewBox="0 0 930 286" font-family="'DejaVu Sans', Arial, Helvetica, sans-serif">
<title>Toktarov family tree</title>
<desc>Erlan Toktarov and Anara Toktarova; their sons Ruslan, Alikhan, Timur, Adil and Bekzat and daughter Zara, who is married to Lieutenant Governor Aidar Maksat.</desc>
