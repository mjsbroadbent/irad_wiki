<text x="265" y="55" font-size="10.5" text-anchor="middle" fill="#555555">b. 1954</text><text x="265" y="67" font-size="10.5" text-anchor="middle" fill="#555555">Governor of the ISEZ, 2007–</text>
<rect x="425.0" y="29.0" width="150" height="34" fill="#fff" stroke="#202122" stroke-width="1"/>
<text x="500" y="50" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#202122">Anara Toktarova</text>

