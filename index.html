<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Irad Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: reference-encyclopedia shell. Sticky masthead with search, a quiet
   left rail of navigation, and a single reading column at ~68ch with a
   floated infobox. Crimson and gold come from the flag; neutrals lean warm-red. */
:root {
  --bg: #fcfafa;
  --panel: #f4eff0;
  --ink: #1d181a;
  --muted: #6c6064;
  --rule: #e3d9dc;
  --accent: #9e1830;
  --accent-ink: #ffffff;
  --link: #1f4e8c;
  --link-visited: #6a3d8a;
  --gold: #a87918;
  --mark: #f6e3a8;
  --good: #2f6b3f;
  --font-display: 'Alegreya', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --font-body: 'Alegreya', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --font-ui: 'Alegreya Sans', 'Gill Sans', 'Segoe UI', system-ui, sans-serif;
  --measure: 68ch;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151113; --panel: #1f191c; --ink: #ece5e7; --muted: #a8999e; --rule: #3a2f33;
    --accent: #e25a6f; --accent-ink: #1a0f12; --link: #8db4ec; --link-visited: #c4a1e0;
    --gold: #e0b85a; --mark: #5a4614; --good: #7fc28f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151113; --panel: #1f191c; --ink: #ece5e7; --muted: #a8999e; --rule: #3a2f33;
  --accent: #e25a6f; --accent-ink: #1a0f12; --link: #8db4ec; --link-visited: #c4a1e0;
  --gold: #e0b85a; --mark: #5a4614; --good: #7fc28f; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 400 1.0625rem/1.6 var(--font-body); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
button { font: inherit; color: inherit; }

/* Masthead */
.mast {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 1px solid var(--rule);
}
.mast-in {
  display: flex; align-items: center; gap: 16px;
  max-width: 1240px; margin: 0 auto; padding: 10px 16px;
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); flex: none; }
.brand:hover { text-decoration: none; }
.brand img { width: 46px; height: auto; border: 1px solid var(--rule); display: block; }
.brand-name { font: 700 1.35rem/1 var(--font-display); letter-spacing: .01em; }
.brand-sub { display: block; font: 400 .72rem/1.2 var(--font-ui); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
.search { position: relative; flex: 1; max-width: 520px; margin-left: auto; }
.search input {
  width: 100%; font: 400 1rem/1 var(--font-ui); color: var(--ink);
  background: var(--panel); border: 1px solid var(--rule); border-radius: 6px;
  padding: 10px 12px 10px 36px;
}
.search input:focus { outline: none; border-color: var(--accent); background: var(--bg); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); }
.suggest {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px 0; list-style: none;
  background: var(--bg); border: 1px solid var(--rule); border-radius: 6px;
  box-shadow: 0 8px 24px rgb(0 0 0 / .12); font-family: var(--font-ui); max-height: 70vh; overflow-y: auto;
}
.suggest li a { display: flex; justify-content: space-between; gap: 12px; padding: 7px 12px; color: var(--ink); }
.suggest li a:hover, .suggest li.on a { background: var(--panel); text-decoration: none; }
.suggest small { color: var(--muted); white-space: nowrap; }
.suggest .all a { color: var(--link); border-top: 1px solid var(--rule); margin-top: 4px; }
.menu-btn { display: none; background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; font: 500 .9rem/1 var(--font-ui); cursor: pointer; }

/* Shell */
.shell { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 40px; max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; }
.rail { font-family: var(--font-ui); font-size: .95rem; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); align-self: start; max-height: calc(100vh - 100px); overflow-y: auto; }
.rail h2 { font: 700 .72rem/1 var(--font-ui); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 22px 0 8px; }
.rail h2:first-child { margin-top: 0; }
.rail ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.rail a { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; color: var(--ink); }
.rail a.here { color: var(--accent); font-weight: 700; }
.rail .n { color: var(--muted); font-variant-numeric: tabular-nums; }
main { min-width: 0; }

/* Status / loading */
.status { max-width: var(--measure); margin: 12vh auto; text-align: center; font-family: var(--font-ui); color: var(--muted); }
.status img { width: 120px; border: 1px solid var(--rule); margin-bottom: 18px; }
.status h1 { font: 500 1.6rem/1.2 var(--font-display); color: var(--ink); margin: 0 0 8px; }
.status code { font-size: .9em; background: var(--panel); padding: 2px 6px; border-radius: 4px; }
.status.err { text-align: left; }
.bar { height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; margin-top: 16px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

/* Article */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font: 400 .88rem/1.4 var(--font-ui); color: var(--muted); margin-bottom: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font: 700 .7rem/1 var(--font-ui); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
.chip.FA { color: var(--gold); border-color: currentColor; }
.chip.GA { color: var(--good); border-color: currentColor; }
.chip.B { color: var(--link); border-color: currentColor; }
a.chip:hover { text-decoration: none; background: var(--panel); }
h1.title { font: 500 clamp(2rem, 4.2vw, 2.85rem)/1.1 var(--font-display); margin: 4px 0 6px; text-wrap: balance; letter-spacing: -.005em; }
.from { font: italic 400 .95rem/1.4 var(--font-body); color: var(--muted); margin: 0 0 22px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }

.prose { max-width: var(--measure); }
.prose.has-ib { max-width: calc(var(--measure) + 330px); }
.prose::after { content: ''; display: table; clear: both; }
.prose p { margin: 0 0 1em; }
.prose h2 { font: 500 1.6rem/1.2 var(--font-display); margin: 1.6em 0 .5em; padding-bottom: 4px; border-bottom: 1px solid var(--rule); text-wrap: balance; }
.prose h3, .prose h4 { font: 700 1.1rem/1.3 var(--font-body); margin: 1.3em 0 .4em; }
.prose a.wl:visited { color: var(--link-visited); }
.prose a.red { color: var(--accent); }
.prose sup { line-height: 0; font: 500 .72em/0 var(--font-ui); }
.prose sup.cite { color: var(--link); cursor: pointer; }
.prose sup.cite:hover { text-decoration: underline; }
.prose ul, .prose ol { padding-left: 1.4em; margin: 0 0 1em; }
.prose blockquote { margin: 0 0 1em; padding: 2px 0 2px 16px; border-left: 3px solid var(--rule); color: var(--muted); }
.prose ol.references { font-size: .9rem; line-height: 1.5; color: var(--ink); padding-left: 2em; }
.prose ol.references li { margin-bottom: 4px; }
.prose ol.references li b { color: var(--muted); font-weight: 400; margin-right: 2px; }
.prose li.flash { background: var(--mark); border-radius: 2px; }
.prose hr { border: 0; border-top: 1px solid var(--rule); margin: 1.6em 0; }
.prose code, .prose pre { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .88em; }
.prose pre { background: var(--panel); padding: 12px; border-radius: 4px; overflow-x: auto; }
.tbl { overflow-x: auto; margin: 0 0 1.2em; }
.prose table { border-collapse: collapse; font: 400 .92rem/1.45 var(--font-ui); min-width: 60%; }
.prose th, .prose td { border: 1px solid var(--rule); padding: 6px 10px; text-align: left; vertical-align: top; }
.prose th { background: var(--panel); font-weight: 700; }
.prose td { font-variant-numeric: tabular-nums; }
.hatnote { font-style: italic; color: var(--muted); padding-left: 1.6em; margin: 0 0 1em; font-size: .97rem; }
.stub-note { display: flex; gap: 12px; align-items: center; margin: 1.6em 0 1em; padding: 10px 14px; border: 1px dashed var(--rule); border-radius: 4px; font: italic 400 .92rem/1.4 var(--font-body); color: var(--muted); }
.stub-note svg { flex: none; width: 22px; height: 22px; stroke: var(--muted); }

.toc { float: none; display: inline-block; min-width: 220px; max-width: 100%; margin: 0 0 1.2em; padding: 12px 18px 12px 16px; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; font-family: var(--font-ui); font-size: .92rem; }
.toc b { display: block; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.toc ol { margin: 0; padding-left: 1.4em; }
.toc li { padding: 1px 0; }
.toc li::marker { color: var(--muted); font-variant-numeric: tabular-nums; }
.toc button { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; text-align: left; }
.toc button:hover { text-decoration: underline; }

.infobox { float: right; clear: right; width: 300px; margin: 0 0 18px 26px; border: 1px solid var(--rule); background: var(--panel); font: 400 .88rem/1.4 var(--font-ui); }
.infobox .ib-head { padding: 12px 12px 10px; text-align: center; border-bottom: 1px solid var(--rule); }
.infobox .ib-head b { display: block; font: 700 1.05rem/1.25 var(--font-display); }
.infobox .ib-head span { display: block; color: var(--muted); font-size: .82rem; margin-top: 3px; }
.infobox figure { margin: 0; padding: 12px; text-align: center; border-bottom: 1px solid var(--rule); }
.infobox figure img { width: 100%; max-width: 230px; border: 1px solid var(--rule); }
.infobox figcaption { font-size: .8rem; color: var(--muted); margin-top: 6px; line-height: 1.35; }
.infobox dl { margin: 0; padding: 6px 12px 10px; display: grid; grid-template-columns: 40% minmax(0, 1fr); gap: 6px 10px; }
.infobox dt { font-weight: 700; }
.infobox dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.infobox ul { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 3px; }
.infobox ul i { font-style: normal; color: var(--muted); }

.backlinks { max-width: var(--measure); margin-top: 2.4em; border-top: 1px solid var(--rule); padding-top: 14px; font-family: var(--font-ui); }
.backlinks summary { cursor: pointer; color: var(--muted); font-size: .95rem; }
.backlinks ul { columns: 2 220px; column-gap: 24px; padding: 0; list-style: none; margin: 10px 0 0; font-size: .95rem; }
.backlinks li { break-inside: avoid; padding: 2px 0; }
.source { font: 400 .8rem/1.4 var(--font-ui); color: var(--muted); margin-top: 14px; }
.source code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .95em; }

/* Lists (class, category, search, index) */
.page-head h1 { font: 500 clamp(1.9rem, 3.6vw, 2.5rem)/1.12 var(--font-display); margin: 0 0 6px; text-wrap: balance; }
.page-head p { color: var(--muted); margin: 0 0 22px; max-width: var(--measure); }
.alist { list-style: none; padding: 0; margin: 0; max-width: 820px; }
.alist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; padding: 11px 0; border-bottom: 1px solid var(--rule); }
.alist li > a { font: 500 1.08rem/1.3 var(--font-body); }
.alist .meta { font: 400 .8rem/1.3 var(--font-ui); color: var(--muted); text-align: right; white-space: nowrap; }
.alist p { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: .95rem; line-height: 1.45; }
.alist mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; font-family: var(--font-ui); }
.filters button { border: 1px solid var(--rule); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: .88rem; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.empty { color: var(--muted); font-style: italic; }

.letters { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 22px; font-family: var(--font-ui); }
.letters button { min-width: 32px; padding: 5px 6px; border: 1px solid var(--rule); background: var(--bg); border-radius: 4px; cursor: pointer; font-weight: 500; }
.letters button:hover { border-color: var(--accent); color: var(--accent); }
.az h2 { font: 500 1.7rem/1 var(--font-display); color: var(--accent); margin: 26px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); scroll-margin-top: 90px; }
.az ul { columns: 3 220px; column-gap: 28px; list-style: none; padding: 0; margin: 0; }
.az li { break-inside: avoid; padding: 2px 0; }
.az li small { color: var(--muted); font: 400 .78rem var(--font-ui); margin-left: 4px; }

/* Main page */
.welcome { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 26px; align-items: start; padding-bottom: 22px; border-bottom: 1px solid var(--rule); margin-bottom: 28px; }
.welcome img { width: 132px; border: 1px solid var(--rule); display: block; margin-top: 8px; }
.welcome h1 { font: 500 clamp(2rem, 4vw, 2.7rem)/1.08 var(--font-display); margin: 0 0 8px; text-wrap: balance; }
.welcome h1 em { font-style: italic; color: var(--accent); }
.welcome p { margin: 0 0 10px; max-width: 62ch; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 400 .9rem/1.3 var(--font-ui); color: var(--muted); }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.home { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 36px; }
.home section { min-width: 0; }
.home h2 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font: 700 .76rem/1 var(--font-ui); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 12px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.home h2 a { font-weight: 500; letter-spacing: .04em; text-transform: none; font-size: .85rem; }
.home .block + .block { margin-top: 34px; }
.feature h3 { font: 500 1.75rem/1.15 var(--font-display); margin: 0 0 8px; }
.feature .prose { max-width: none; }
.feature .more { font-family: var(--font-ui); font-weight: 500; }
.dyk { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.dyk li { padding-left: 14px; border-left: 2px solid var(--rule); font-size: .98rem; line-height: 1.5; }
.dyk li a { font-weight: 700; }
.ga { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: 1.02rem; }
.classes { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; font-family: var(--font-ui); }
.classes li a { display: grid; grid-template-columns: 108px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--rule); color: var(--ink); }
.classes li a:hover { text-decoration: none; background: var(--panel); }
.classes .n { font-variant-numeric: tabular-nums; color: var(--muted); }
.classes .chip { justify-self: start; }
.subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px 28px; }
.subjects h3 { font: 500 1.2rem/1.2 var(--font-display); margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px; }
.subjects h3 span { font: 400 .82rem var(--font-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
.subjects ul { list-style: none; padding: 0; margin: 0; font: 400 .92rem/1.35 var(--font-ui); display: grid; gap: 3px; }
.subjects li { display: flex; justify-content: space-between; gap: 10px; }
.subjects li span { color: var(--muted); font-variant-numeric: tabular-nums; }
.wide { grid-column: 1 / -1; }

@media (max-width: 960px) {
  .home { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .menu-btn { display: inline-block; }
  .rail { position: static; max-height: none; display: none; padding: 4px 0 18px; margin-bottom: 18px; border-bottom: 1px solid var(--rule); }
  .rail.open { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0 20px; }
  .rail.open h2 { grid-column: 1 / -1; margin-top: 14px; }
  .brand-sub { display: none; }
}
@media (max-width: 640px) {
  .infobox { float: none; width: 100%; margin: 0 0 18px; }
  .brand-name { font-size: 1.15rem; }
  .brand img { width: 36px; }
  .welcome { grid-template-columns: minmax(0, 1fr); }
  .welcome img { width: 96px; }
  .alist li { grid-template-columns: minmax(0, 1fr); }
  .alist .meta { text-align: left; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

</head>
<body>
<header class="mast">
  <div class="mast-in">
    <a class="brand" href="#" aria-label="Irad Wiki main page">
      <img id="flag" src="webflag.svg" alt="Flag of Irad">
      <span><span class="brand-name">Irad Wiki</span><span class="brand-sub">The free encyclopedia of Iradistan</span></span>
    </a>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search articles" aria-controls="suggest" aria-expanded="false">
      <ul class="suggest" id="suggest" role="listbox" hidden></ul>
    </div>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="rail">Menu</button>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Wiki navigation"></nav>
  <main id="main">
    <div class="status">
      <img src="webflag.svg" alt="">
      <h1>Opening the encyclopedia</h1>
      <div id="loadMsg">Loading the article volumes…</div>
      <div class="bar"><i id="loadBar"></i></div>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.min.js"></script>
<script>
/* Irad Wiki core: splits the volume files into articles. No DOM access, so it
   also runs in Node for testing. Edit VOLUMES if file names or layout change. */

const VOLUMES = [
  {
    file: 'Irad_Wiki_Vol1_Core.md',
    label: 'Volume 1',
    // "### 2.1. Talas" — the featured article is plain "### Irad"
    article: /^### (?:(\d+\.\d+)\.\s+)?(.+?)\s*$/,
  },
  {
    file: 'Irad_Wiki_Vol2_C_Class.md',
    label: 'Volume 2',
    article: /^### (\d+\.\d+)\.\s+(.+?)\s*$/,
  },
  {
    file: 'Irad_Wiki_Vol3_Start_Stub.md',
    label: 'Volume 3',
    // "### 5.Category: Biographies & Leadership (36 articles)"
    category: /^### \d+\.Category:\s*(.+?)\s*\(\d+ articles?\)\s*$/,
    // "#### 1. Mar Timotheos Alimbekov"
    article: /^#### (\d+)\.\s+(.+?)\s*$/,
  },
];

// "## 3. B-Class Articles (43 Entries)" starts a quality class section.
const CLASS_HEADING = /^## \d+\.\s+(.+?)\s*$/;
const META_LINE = /^\*Quality(?: Assessment)?:\s*(.+?)\s*\|\s*Category:\s*(.+?)\s*\*\s*$/;
const STUB_TEMPLATE = /\{\{\s*([^}]+?)\s*\}\}/g;
const WIKILINK = /\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g;

const CLASSES = [
  { id: 'FA', name: 'Featured articles', short: 'Featured', blurb: 'The best articles in the wiki, reviewed for completeness, sourcing and prose.' },
  { id: 'GA', name: 'Good articles', short: 'Good', blurb: 'Well-written, broad and properly sourced articles that meet the good-article criteria.' },
  { id: 'B', name: 'B-Class articles', short: 'B-Class', blurb: 'Mostly complete articles on the principal people, places and institutions of Irad.' },
  { id: 'C', name: 'C-Class articles', short: 'C-Class', blurb: 'Substantial articles that still have gaps in coverage or sourcing.' },
  { id: 'Start', name: 'Start-Class articles', short: 'Start', blurb: 'Developing articles with a basic outline and some sources.' },
  { id: 'Stub', name: 'Stub articles', short: 'Stub', blurb: 'Short entries of a paragraph or two, mostly terms, places and minor figures.' },
];

function classFromHeading(text) {
  if (/featured/i.test(text)) return 'FA';
  if (/good/i.test(text)) return 'GA';
  if (/\bB-Class/i.test(text)) return 'B';
  if (/\bC-Class/i.test(text)) return 'C';
  if (/start/i.test(text)) return 'Start';
  if (/stub/i.test(text)) return 'Stub';
  return null;
}

/* Broad subject for a category name, used to group the many category names
   on the main page. Keyed on the first word of the category. */
const SUBJECTS = {
  Biographies: 'People', Biography: 'People', Historical: 'People',
  History: 'History',
  Culture: 'Culture & arts', Cultural: 'Culture & arts', Arts: 'Culture & arts', Language: 'Culture & arts',
  Media: 'Culture & arts', National: 'Culture & arts',
  Religion: 'Religion',
  Politics: 'Politics & law', Regions: 'Politics & law', Security: 'Politics & law', Military: 'Politics & law',
  Institutions: 'Politics & law', Public: 'Politics & law',
  Economy: 'Economy', Agriculture: 'Economy', Education: 'Economy',
  Infrastructure: 'Infrastructure', Transport: 'Infrastructure',
  Geography: 'Places', Cities: 'Places', Minor: 'Places', Nation: 'Places', Demographics: 'Places',
  Physical: 'Nature', Nature: 'Nature', Wildlife: 'Nature', Equines: 'Nature', Science: 'Nature',
};
function subjectOf(category) {
  const w = category.split(/[\s,&]+/)[0];
  return SUBJECTS[w] || 'Other';
}

function slugOf(title) { return title.replace(/\s+/g, '_'); }
function categorySlug(name) { return name.replace(/&/g, 'and').replace(/[^\p{L}\p{N}]+/gu, '_').replace(/^_|_$/g, ''); }
function fold(s) {
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ı/g, 'i').replace(/[’‘]/g, "'").toLowerCase();
}

function parseVolume(text, cfg, volIndex) {
  const lines = text.split(/\r?\n/);
  const articles = [];
  const pre = [];
  let cls = null, cat = null, cur = null, inFence = false;

  const close = () => {
    if (!cur) return;
    finishArticle(cur);
    articles.push(cur);
    cur = null;
  };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^```/.test(line)) inFence = !inFence;
    if (!inFence) {
      let m = line.match(CLASS_HEADING);
      if (m && classFromHeading(m[1])) { close(); cls = classFromHeading(m[1]); cat = null; continue; }
      if (cfg.category && (m = line.match(cfg.category))) { close(); cat = m[1]; continue; }
      if ((m = line.match(cfg.article))) {
        close();
        cur = { title: m[2], number: m[1] || '', cls, heading: cat, vol: volIndex, line: i + 1, lines: [] };
        continue;
      }
    }
    (cur ? cur.lines : pre).push(line);
  }
  close();
  return { articles, pre: pre.join('\n') };
}

function finishArticle(a) {
  const ls = a.lines;
  // quality / category line near the top
  for (let i = 0; i < Math.min(ls.length, 4); i++) {
    const m = ls[i].match(META_LINE);
    if (m) { a.category = m[2]; ls.splice(i, 1); break; }
  }
  if (!a.category) a.category = a.heading || 'Uncategorized';
  while (ls.length && /^\s*(---)?\s*$/.test(ls[ls.length - 1])) ls.pop();
  while (ls.length && /^\s*$/.test(ls[0])) ls.shift();
  a.src = ls.join('\n');
  delete a.lines;
  const stub = a.src.match(/\{\{\s*([^}]*?stub[^}]*?)\s*\}\}/i);
  a.stubType = stub ? stub[1] : null;
  a.slug = slugOf(a.title);
  a.links = new Set();
  for (const m of a.src.matchAll(WIKILINK)) a.links.add(m[1].trim());
}

/* Plain text of an article for search and summaries. */
function plainText(src) {
  return src
    .replace(/<sup>.*?<\/sup>/g, '')
    .replace(/<ol class="references">[\s\S]*?<\/ol>/g, '')
    .replace(WIKILINK, (_, t, l) => l || t)
    .replace(STUB_TEMPLATE, '')
    .replace(/<[^>]+>/g, '')
    .replace(/^#+\s*/gm, '')
    .replace(/^\|.*\|$/gm, m => m.replace(/\|/g, ' ').replace(/-{3,}/g, ''))
    .replace(/[*_`]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function lede(src, max = 170) {
  const para = src.split(/\n\s*\n/).find(p => p.trim() && !/^\s*(#|<|\{\{|\||```)/.test(p)) || '';
  let t = plainText(para);
  if (t.length > max) {
    const cut = t.lastIndexOf(' ', max);
    t = t.slice(0, cut > 60 ? cut : max).replace(/[,;:]$/, '') + '…';
  }
  return t;
}

/* Builds the whole wiki from the volume texts (same order as VOLUMES). */
function buildWiki(texts) {
  const wiki = { articles: [], bySlug: new Map(), byFold: new Map(), categories: new Map(), backlinks: new Map(), pre: [], warnings: [] };
  texts.forEach((text, vi) => {
    const { articles, pre } = parseVolume(text, VOLUMES[vi], vi);
    wiki.pre.push(pre);
    for (const a of articles) {
      if (wiki.bySlug.has(a.slug)) wiki.warnings.push(`Duplicate title "${a.title}" (${VOLUMES[vi].file}, line ${a.line}); the first copy is shown.`);
      else { wiki.bySlug.set(a.slug, a); wiki.byFold.set(fold(a.title), a); }
      wiki.articles.push(a);
      if (!wiki.categories.has(a.category)) wiki.categories.set(a.category, []);
      wiki.categories.get(a.category).push(a);
    }
  });
  for (const a of wiki.articles) {
    for (const t of a.links) {
      const target = resolve(wiki, t);
      if (!target || target === a) continue;
      if (!wiki.backlinks.has(target.slug)) wiki.backlinks.set(target.slug, new Set());
      wiki.backlinks.get(target.slug).add(a);
    }
  }
  return wiki;
}

function resolve(wiki, title) {
  return wiki.bySlug.get(slugOf(title.trim())) || wiki.byFold.get(fold(title.trim())) || null;
}

/* Turns the "Country Overview" code block into infobox rows. */
function parseInfobox(block) {
  const parts = block.split(/^=+\s*$/m).map(s => s.replace(/^\n+|\n+$/g, '')).filter(Boolean);
  if (parts.length < 2) return null;
  const head = parts[0].split('\n');
  const box = { name: head[0].trim(), subtitle: head.slice(1).join(' ').trim(), rows: [] };
  let last = null, lastItem = null;
  const join = (prev, next) => prev + ' ' + next;
  for (const raw of parts[1].split('\n')) {
    if (!raw.trim()) continue;
    if (/^\s*•/.test(raw) && last) {
      const t = raw.replace(/^\s*•\s*/, '');
      const m = t.match(/^([^:]{1,40}):\s*(.+)$/);
      lastItem = m ? { label: m[1], value: m[2] } : { label: '', value: t };
      last.items.push(lastItem);
    } else if (/^\s/.test(raw) && last) {
      const t = raw.trim();
      if (lastItem) lastItem.value = join(lastItem.value, t); else last.value = join(last.value, t);
    } else {
      for (const seg of raw.split(/\s+\|\s+/)) {
        const m = seg.match(/^([^:]{1,70}?):\s*(.*)$/);
        if (m) { last = { key: m[1].trim(), value: m[2].trim(), items: [] }; lastItem = null; box.rows.push(last); }
        else if (last) last.value = join(last.value, seg.trim());
      }
    }
  }
  for (const r of box.rows) r.value = r.value.replace(/\s*\(webflag\.svg\)/, '');
  return box;
}

if (typeof module !== 'undefined') module.exports = { VOLUMES, CLASSES, subjectOf, buildWiki, parseInfobox, plainText, lede, fold, slugOf, categorySlug, resolve, WIKILINK, STUB_TEMPLATE };

<script>
/* Irad Wiki app: loading, routing and rendering. Depends on core.js and markdown-it. */
(function () {
  'use strict';
  const BASE = './';                 // folder that holds the volume files and webflag.svg
  const FLAG = BASE + 'webflag.svg';
  const $ = s => document.querySelector(s);
  const main = $('#main');
  const rail = $('#rail');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const href = slug => '#' + encodeURIComponent(slug).replace(/%2C/g, ',').replace(/%3A/g, ':');
  const classOf = id => CLASSES.find(c => c.id === id);
  const collator = new Intl.Collator('en', { sensitivity: 'base', numeric: true });
  const byTitle = (a, b) => collator.compare(a.title.replace(/^the\s+/i, ''), b.title.replace(/^the\s+/i, ''));

  let wiki = null, md = null, infobox = null, query = '', searchIndex = null;
  const ledeCache = new Map();
  const ledeOf = a => { if (!ledeCache.has(a)) ledeCache.set(a, lede(a.src)); return ledeCache.get(a); };

  /* ---------- loading ---------- */
  async function load() {
    if (!window.markdownit) return fail('The Markdown library did not load. Check your internet connection, then reload the page.');
    md = window.markdownit({ html: true, linkify: false, typographer: false });
    let done = 0;
    const bar = $('#loadBar'), msg = $('#loadMsg');
    try {
      const texts = await Promise.all(VOLUMES.map(async v => {
        const r = await fetch(BASE + v.file);
        if (!r.ok) throw new Error(`${v.file} returned ${r.status} ${r.statusText}`);
        const t = await r.text();
        done++;
        bar.style.width = (done / VOLUMES.length * 100) + '%';
        msg.textContent = `Loaded ${done} of ${VOLUMES.length} volumes`;
        return t;
      }));
      wiki = buildWiki(texts);
    } catch (e) {
      const local = location.protocol === 'file:';
      return fail(local
        ? 'Browsers block a page opened straight from disk from reading the volume files. Serve the folder over HTTP instead, for example with <code>python3 -m http.server</code> in this folder, then open <code>http://localhost:8000</code>.'
        : `Couldn't read the article volumes (${esc(e.message)}). Make sure the three <code>Irad_Wiki_Vol…md</code> files sit in the same folder as this page.`);
    }
    if (wiki.warnings.length) console.warn('Irad Wiki:\n' + wiki.warnings.join('\n'));
    const block = (wiki.pre[0] || '').match(/```\s*\n([\s\S]*?)```/);
    infobox = block ? parseInfobox(block[1]) : null;
    wiki.sorted = [...wiki.articles].sort(byTitle);
    wiki.subjects = new Map();
    for (const [cat, list] of wiki.categories) {
      const s = subjectOf(cat);
      if (!wiki.subjects.has(s)) wiki.subjects.set(s, new Map());
      wiki.subjects.get(s).set(cat, list);
    }
    wiki.catBySlug = new Map([...wiki.categories.keys()].map(c => [categorySlug(c), c]));
    wiki.subjBySlug = new Map([...wiki.subjects.keys()].map(s => [categorySlug(s), s]));
    renderRail();
    route();
  }

  function fail(html) {
    main.innerHTML = `<div class="status err"><img src="${FLAG}" alt=""><h1>The wiki couldn't load</h1><p>${html}</p></div>`;
  }

  /* ---------- routing ---------- */
  let byClick = false;
  const scrolls = new Map();
  let current = null;
  addEventListener('scroll', () => { if (current !== null) scrolls.set(current, scrollY); }, { passive: true });
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]');
    if (a) byClick = true;
  });
  addEventListener('hashchange', route);

  function route() {
    if (!wiki) return;
    let key = '';
    try { key = decodeURIComponent(location.hash.slice(1)); } catch { key = location.hash.slice(1); }
    const fresh = byClick; byClick = false;
    current = key;
    closeSuggest();
    rail.classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false');

    if (key === 'Special.Random') {
      const a = wiki.articles[Math.floor(Math.random() * wiki.articles.length)];
      location.replace(href(a.slug));
      return;
    }
    let title;
    if (!key) title = renderHome();
    else if (key === 'Special.All') title = renderIndex();
    else if (key === 'Special.Search') title = renderSearch();
    else if (key.startsWith('Class.') && classOf(key.slice(6))) title = renderClass(key.slice(6));
    else if (key.startsWith('Category.') && wiki.catBySlug.has(key.slice(9))) title = renderCategory(wiki.catBySlug.get(key.slice(9)));
    else if (key.startsWith('Subject.') && wiki.subjBySlug.has(key.slice(8))) title = renderSubject(wiki.subjBySlug.get(key.slice(8)));
    else {
      const a = wiki.bySlug.get(key) || resolve(wiki, key.replace(/_/g, ' '));
      title = a ? renderArticle(a) : renderMissing(key);
    }
    document.title = title ? `${title} – Irad Wiki` : 'Irad Wiki';
    markRail(key);
    const y = !fresh && scrolls.has(key) ? scrolls.get(key) : 0;
    requestAnimationFrame(() => scrollTo(0, y));
  }

  /* ---------- rail ---------- */
  function renderRail() {
    const count = id => wiki.articles.filter(a => a.cls === id).length;
    const subj = [...wiki.subjects].map(([s, cats]) => [s, [...cats.values()].reduce((n, l) => n + l.length, 0)]).sort((a, b) => b[1] - a[1]);
    rail.innerHTML = `
      <h2>Navigation</h2>
      <ul>
        <li><a href="#" data-k="">Main page</a></li>
        <li><a href="#Special.All" data-k="Special.All">All articles <span class="n">${wiki.articles.length}</span></a></li>
        <li><a href="#Special.Random" data-k="Special.Random">Random article</a></li>
      </ul>
      <h2>By quality</h2>
      <ul>${CLASSES.map(c => `<li><a href="#Class.${c.id}" data-k="Class.${c.id}">${c.short} <span class="n">${count(c.id)}</span></a></li>`).join('')}</ul>
      <h2>By subject</h2>
      <ul>${subj.map(([s, n]) => `<li><a href="#Subject.${categorySlug(s)}" data-k="Subject.${categorySlug(s)}">${esc(s)} <span class="n">${n}</span></a></li>`).join('')}</ul>`;
  }
  function markRail(key) {
    rail.querySelectorAll('a').forEach(a => a.classList.toggle('here', a.dataset.k === key));
  }
  $('#menuBtn').addEventListener('click', () => {
    const open = rail.classList.toggle('open');
    $('#menuBtn').setAttribute('aria-expanded', String(open));
  });

  /* ---------- markdown ---------- */
  const STUB_WORDS = {
    geo: 'the geography of Irad', culture: 'Iradi culture', bio: 'an Iradi person', org: 'an Iradi organization',
    settlement: 'a settlement in Irad', plant: 'a plant of Irad', fauna: 'the animals of Irad', mountain: 'a mountain in Irad',
    craft: 'an Iradi craft', lake: 'a lake in Irad', river: 'a river in Irad', history: 'the history of Irad',
    horse: 'Iradi horses', sport: 'sport in Irad', glacier: 'a glacier in Irad',
  };
  const STUB_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>';

  function toHtml(src) {
    // links first, so templates such as {{Hatnote|… see [[Talas River]]}} keep working links
    const pre = src
      .replace(WIKILINK, (_, t, label) => {
        const target = resolve(wiki, t);
        const text = label || t;
        return target
          ? `<a class="wl" href="${href(target.slug)}" title="${esc(target.title)}">${esc(text)}</a>`
          : `<a class="red" href="${href(slugOf(t.trim()))}" title="${esc(t)} (page does not exist)">${esc(text)}</a>`;
      })
      .replace(STUB_TEMPLATE, (_, body) => {
        const [name, ...args] = body.split('|');
        if (/^hatnote$/i.test(name.trim())) return `<div class="hatnote">${args.join('|')}</div>`;
        const m = name.match(/^Irad-(\w+)-stub$/i);
        if (m || /^Irad-stub$/i.test(name)) {
          const about = m ? (STUB_WORDS[m[1].toLowerCase()] || m[1].toLowerCase() + ' in Irad') : 'Irad';
          return `<div class="stub-note">${STUB_ICON}<span>This article about ${about} is a stub. You can help Irad Wiki by expanding it.</span></div>`;
        }
        return `<div class="stub-note">${esc(name)}${args.length ? ': ' + args.join(' | ') : ''}</div>`;
      });
    return md.render(pre);
  }

  /* Wraps tables, numbers headings, makes citation markers clickable. */
  function enhance(root) {
    root.querySelectorAll('table').forEach(t => {
      if (t.parentElement.classList.contains('tbl')) return;
      const w = document.createElement('div'); w.className = 'tbl'; t.replaceWith(w); w.appendChild(t);
    });
    root.querySelectorAll('sup').forEach(s => {
      const m = s.textContent.trim().match(/^\[(\d+)\]$/);
      if (!m) return;
      s.classList.add('cite'); s.tabIndex = 0; s.setAttribute('role', 'link'); s.dataset.n = m[1];
      s.setAttribute('aria-label', `Reference ${m[1]}`);
    });
  }
  main.addEventListener('click', e => { const s = e.target.closest('sup.cite'); if (s) jumpCite(s); });
  main.addEventListener('keydown', e => { const s = e.target.closest('sup.cite'); if (s && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); jumpCite(s); } });
  function jumpCite(s) {
    const li = s.closest('.prose').querySelector(`[id="cite_note-${s.dataset.n}"]`);
    if (!li) return;
    li.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    li.classList.remove('flash'); void li.offsetWidth; li.classList.add('flash');
    setTimeout(() => li.classList.remove('flash'), 1800);
  }

  /* ---------- pages ---------- */
  function chip(a) {
    const c = classOf(a.cls);
    return `<a class="chip ${a.cls}" href="#Class.${a.cls}">${a.cls === 'FA' ? '★ ' : ''}${esc(c ? c.short : a.cls)}</a>`;
  }

  function renderArticle(a) {
    const body = document.createElement('div');
    body.className = 'prose';
    body.innerHTML = toHtml(a.src);
    enhance(body);

    // table of contents for longer articles
    const hs = [...body.querySelectorAll('h2')];
    hs.forEach((h, i) => { h.id = 's' + (i + 1); });
    if (hs.length >= 4) {
      const toc = document.createElement('div');
      toc.className = 'toc';
      toc.innerHTML = `<b>Contents</b><ol>${hs.map((h, i) => `<li><button type="button" data-to="s${i + 1}">${esc(h.textContent)}</button></li>`).join('')}</ol>`;
      const first = body.querySelector('h2');
      first.before(toc);
    }
    if (a.slug === 'Irad' && infobox) { body.prepend(renderInfobox(infobox)); body.classList.add('has-ib'); }

    const back = [...(wiki.backlinks.get(a.slug) || [])].sort(byTitle);
    const vol = VOLUMES[a.vol];
    main.innerHTML = `
      <article>
        <div class="crumbs">${chip(a)}<a href="#Category.${categorySlug(a.category)}">${esc(a.category)}</a></div>
        <h1 class="title">${esc(a.title)}</h1>
        <p class="from">From Irad Wiki, the free encyclopedia of Iradistan</p>
        <div id="body"></div>
        ${back.length ? `<details class="backlinks"><summary>Linked from ${back.length} article${back.length > 1 ? 's' : ''}</summary><ul>${back.map(b => `<li><a href="${href(b.slug)}">${esc(b.title)}</a></li>`).join('')}</ul></details>` : ''}
        <p class="source">Source: <code>${esc(vol.file)}</code>${a.number ? `, §${esc(a.number)}` : ''}, line ${a.line}</p>
      </article>`;
    $('#body').replaceWith(body);
    body.addEventListener('click', e => {
      const b = e.target.closest('.toc button');
      if (b) document.getElementById(b.dataset.to)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    });

  }

  function linkNames(text) {
    // Links values in the infobox that are exactly an article title, e.g. "Talas".
    return esc(text).replace(/^([^(;,]+?)(\s*\(|$)/, (m, name, rest) => {
      const t = resolve(wiki, name.trim());
      return t ? `<a href="${href(t.slug)}">${esc(name)}</a>${rest}` : m;
    });
  }

  function renderInfobox(box) {
    const el = document.createElement('aside');
    el.className = 'infobox';
    const flag = box.rows.find(r => r.key === 'Flag');
    const rows = box.rows.filter(r => r !== flag);
    el.innerHTML = `
      <div class="ib-head"><b>${esc(box.name)}</b>${box.subtitle ? `<span>${esc(box.subtitle)}</span>` : ''}</div>
      <figure><img src="${FLAG}" alt="Flag of Irad">${flag ? `<figcaption>${esc(flag.value)}</figcaption>` : ''}</figure>
      <dl>${rows.map(r => `<dt>${esc(r.key)}</dt><dd>${r.value ? linkNames(r.value) : ''}${r.items.length ? `<ul>${r.items.map(i => `<li>${i.label ? `<i>${esc(i.label)}:</i> ` : ''}${linkNames(i.value)}</li>`).join('')}</ul>` : ''}</dd>`).join('')}</dl>`;
    return el;
  }

  function renderMissing(key) {
    const t = key.replace(/_/g, ' ');
    const near = wiki.sorted.filter(a => fold(a.title).includes(fold(t).slice(0, 6))).slice(0, 8);
    main.innerHTML = `
      <div class="page-head"><h1>${esc(t)}</h1><p>Irad Wiki does not have an article with this exact name.</p></div>
      ${near.length ? `<p>Similar titles:</p><ul class="alist">${near.map(listItem).join('')}</ul>` : ''}
      <p><a href="#Special.Search" id="searchFor">Search the full text for “${esc(t)}”</a></p>`;
    $('#searchFor').addEventListener('click', () => { query = t; });
    return t;
  }

  function listItem(a, snippet) {
    return `<li><a href="${href(a.slug)}">${esc(a.title)}</a><span class="meta">${esc(classOf(a.cls)?.short || '')} · ${esc(a.category)}</span><p>${snippet || esc(ledeOf(a))}</p></li>`;
  }

  /* A filterable list: chips filter by category; used for class and subject pages. */
  function filteredList(articles, groups) {
    const wrap = document.createElement('div');
    let active = null;
    const draw = () => {
      const list = active ? articles.filter(a => a.category === active || a.cls === active) : articles;
      wrap.querySelector('.alist').innerHTML = list.map(a => listItem(a)).join('');
      wrap.querySelectorAll('.filters button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.f || null) === active)));
    };
    wrap.innerHTML = `${groups.length > 1 ? `<div class="filters" role="group" aria-label="Filter">${[['', 'All', articles.length], ...groups].map(([k, l, n]) => `<button type="button" data-f="${esc(k)}">${esc(l)} <span>${n}</span></button>`).join('')}</div>` : ''}<ul class="alist"></ul>`;
    wrap.addEventListener('click', e => {
      const b = e.target.closest('.filters button'); if (!b) return;
      active = b.dataset.f || null; draw();
    });
    draw();
    return wrap;
  }

  function renderClass(id) {
    const c = classOf(id);
    const list = wiki.articles.filter(a => a.cls === id).sort(byTitle);
    const counts = new Map();
    list.forEach(a => counts.set(a.category, (counts.get(a.category) || 0) + 1));
    const groups = [...counts].sort((a, b) => b[1] - a[1]).slice(0, 14).map(([k, n]) => [k, k, n]);
    main.innerHTML = `<div class="page-head"><h1>${esc(c.name)}</h1><p>${esc(c.blurb)} ${list.length} article${list.length === 1 ? '' : 's'}.</p></div>`;
    main.append(filteredList(list, groups));
    return c.name;
  }

  function renderSubject(s) {
    const cats = wiki.subjects.get(s);
    const list = [...cats.values()].flat().sort(byTitle);
    const groups = [...cats].sort((a, b) => b[1].length - a[1].length).map(([k, l]) => [k, k, l.length]);
    main.innerHTML = `<div class="page-head"><h1>${esc(s)}</h1><p>${list.length} articles in ${cats.size} categor${cats.size === 1 ? 'y' : 'ies'}.</p></div>`;
    main.append(filteredList(list, groups));
    return s;
  }

  function renderCategory(cat) {
    const list = [...wiki.categories.get(cat)].sort(byTitle);
    const s = subjectOf(cat);
    main.innerHTML = `
      <div class="crumbs"><a href="#Subject.${categorySlug(s)}">${esc(s)}</a></div>
      <div class="page-head"><h1>Category: ${esc(cat)}</h1><p>${list.length} article${list.length === 1 ? '' : 's'} in this category.</p></div>
      <ul class="alist">${list.map(a => listItem(a)).join('')}</ul>`;
    return 'Category: ' + cat;
  }

  function renderIndex() {
    const groups = new Map();
    for (const a of wiki.sorted) {
      let L = fold(a.title.replace(/^the\s+/i, ''))[0] || '#';
      if (!/[a-z]/.test(L)) L = '#';
      L = L.toUpperCase();
      if (!groups.has(L)) groups.set(L, []);
      groups.get(L).push(a);
    }
    main.innerHTML = `
      <div class="page-head"><h1>All articles</h1><p>Every article in the three volumes, A to Z. ${wiki.articles.length} in total.</p></div>
      <div class="letters">${[...groups.keys()].map(L => `<button type="button" data-to="L-${L}">${L}</button>`).join('')}</div>
      <div class="az">${[...groups].map(([L, list]) => `<h2 id="L-${L}">${L}</h2><ul>${list.map(a => `<li><a href="${href(a.slug)}">${esc(a.title)}</a>${a.cls === 'FA' || a.cls === 'GA' ? `<small>${a.cls}</small>` : ''}</li>`).join('')}</ul>`).join('')}</div>`;
    main.querySelector('.letters').addEventListener('click', e => {
      const b = e.target.closest('button'); if (b) document.getElementById(b.dataset.to)?.scrollIntoView();
    });
    return 'All articles';
  }

  /* ---------- search ---------- */
  function titleMatches(q, limit) {
    const f = fold(q.trim());
    if (!f) return [];
    const starts = [], words = [], contains = [];
    for (const a of wiki.sorted) {
      const t = fold(a.title);
      if (t.startsWith(f)) starts.push(a);
      else if (t.includes(' ' + f) || t.includes('(' + f) || t.includes('-' + f)) words.push(a);
      else if (t.includes(f)) contains.push(a);
    }
    return [...starts, ...words, ...contains].slice(0, limit);
  }

  function buildSearchIndex() {
    searchIndex = wiki.articles.map(a => {
      const text = plainText(a.src);
      return { a, text, f: fold(text) };
    });
  }

  function renderSearch() {
    if (!searchIndex) buildSearchIndex();
    const q = query.trim();
    const head = `<div class="page-head"><h1>Search</h1>`;
    if (!q) {
      main.innerHTML = `${head}<p>Type in the search box above to search titles and the full text of every article.</p></div>`;
      return 'Search';
    }
    const f = fold(q);
    const titleHits = new Set(titleMatches(q, 50));
    const results = [];
    for (const e of searchIndex) {
      const i = e.f.indexOf(f);
      if (i < 0 && !titleHits.has(e.a)) continue;
      let n = 0, p = i;
      while (p >= 0 && n < 50) { n++; p = e.f.indexOf(f, p + f.length); }
      const score = (titleHits.has(e.a) ? 1000 : 0) + (fold(e.a.title) === f ? 1000 : 0) + n;
      results.push({ e, i, score });
    }
    results.sort((x, y) => y.score - x.score || byTitle(x.e.a, y.e.a));
    const snip = ({ e, i }) => {
      if (i < 0) return esc(ledeOf(e.a));
      const s = Math.max(0, e.text.lastIndexOf(' ', Math.max(0, i - 70)));
      const end = Math.min(e.text.length, i + f.length + 110);
      // the folded string has the same length as the original for these scripts, so indexes line up
      const before = e.text.slice(s, i), hit = e.text.slice(i, i + f.length), after = e.text.slice(i + f.length, end);
      return `${s > 0 ? '…' : ''}${esc(before.trimStart())}<mark>${esc(hit)}</mark>${esc(after)}${end < e.text.length ? '…' : ''}`;
    };
    main.innerHTML = `${head}<p>${results.length ? `${results.length} article${results.length === 1 ? '' : 's'} mention “${esc(q)}”.` : `No articles mention “${esc(q)}”. Check the spelling, or try a shorter word.`}</p></div>
      <ul class="alist">${results.slice(0, 150).map(r => listItem(r.e.a, snip(r))).join('')}</ul>
      ${results.length > 150 ? `<p class="empty">Showing the first 150 results. Add another word to narrow the search.</p>` : ''}`;
    return `Search: ${q}`;
  }

  const input = $('#q'), sug = $('#suggest');
  let sel = -1;
  function closeSuggest() { sug.hidden = true; sel = -1; input.setAttribute('aria-expanded', 'false'); }
  function openSuggest() {
    if (!wiki) return;
    const q = input.value.trim();
    if (!q) return closeSuggest();
    const hits = titleMatches(q, 8);
    sug.innerHTML = hits.map((a, i) => `<li role="option" id="opt${i}"><a href="${href(a.slug)}"><span>${esc(a.title)}</span><small>${esc(classOf(a.cls)?.short || '')}</small></a></li>`).join('')
      + `<li class="all" role="option" id="opt${hits.length}"><a href="#Special.Search" data-search="1">Search all articles for “${esc(q)}”</a></li>`;
    sug.hidden = false; sel = -1; input.setAttribute('aria-expanded', 'true');
  }
  input.addEventListener('input', openSuggest);
  input.addEventListener('focus', openSuggest);
  input.addEventListener('keydown', e => {
    const items = [...sug.querySelectorAll('li')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (sug.hidden) return;
      e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((li, i) => li.classList.toggle('on', i === sel));
      input.setAttribute('aria-activedescendant', items[sel].id);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (sel >= 0 && items[sel] && !items[sel].classList.contains('all')) { items[sel].querySelector('a').click(); }
      else runSearch();
    } else if (e.key === 'Escape') { closeSuggest(); }
  });
  sug.addEventListener('mousedown', e => e.preventDefault());
  sug.addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    if (a.dataset.search) { e.preventDefault(); runSearch(); return; }
    input.value = ''; closeSuggest(); input.blur();
  });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) closeSuggest(); });
  function runSearch() {
    query = input.value.trim();
    if (!query) return;
    closeSuggest(); input.blur();
    byClick = true;
    if (location.hash === '#Special.Search') route(); else location.hash = 'Special.Search';
  }

  /* ---------- main page ---------- */
  function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function renderHome() {
    const fa = wiki.articles.find(a => a.cls === 'FA');
    const intro = (wiki.pre[0].match(/^The \*\*Irad Wiki\*\*.*$/m) || [''])[0];
    const firstPara = fa ? fa.src.split(/\n\s*\n/).find(p => p.trim() && !/^\s*[#<{|]/.test(p)) : '';
    const pool = wiki.articles.filter(a => (a.cls === 'Start' || a.cls === 'Stub') && ledeOf(a).length > 60);
    const dyk = shuffle(pool).slice(0, 5);
    const ga = wiki.articles.filter(a => a.cls === 'GA').sort(byTitle);
    const subj = [...wiki.subjects].map(([s, cats]) => [s, [...cats].sort((a, b) => b[1].length - a[1].length)]).sort((a, b) => b[1].reduce((n, c) => n + c[1].length, 0) - a[1].reduce((n, c) => n + c[1].length, 0));
    const count = id => wiki.articles.filter(a => a.cls === id).length;
    const words = Math.round(wiki.articles.reduce((n, a) => n + a.src.split(/\s+/).length, 0) / 1000);

    main.innerHTML = `
      <div class="welcome">
        <img src="${FLAG}" alt="Flag of Irad">
        <div>
          <h1>Welcome to the <em>Irad Wiki</em></h1>
          <p>${intro ? md.renderInline(intro) : 'The free encyclopedia of the Republic of Irad.'}</p>
          <div class="stats"><span><b>${wiki.articles.length}</b> articles</span><span><b>${wiki.categories.size}</b> categories</span><span>about <b>${words}k</b> words</span></div>
        </div>
      </div>
      <div class="home">
        <section>
          <div class="block feature">
            <h2>Featured article ${fa ? `<a href="${href(fa.slug)}">Read the article</a>` : ''}</h2>
            ${fa ? `<h3><a href="${href(fa.slug)}">${esc(fa.title)}</a></h3><div class="prose" id="faText"></div><a class="more" href="${href(fa.slug)}">Continue reading ${esc(fa.title)} →</a>` : ''}
          </div>
          <div class="block">
            <h2>Did you know… <a href="#" id="moreDyk">Show others</a></h2>
            <ul class="dyk">${dyk.map(a => `<li><a href="${href(a.slug)}">${esc(a.title)}</a>: ${esc(ledeOf(a).replace(new RegExp('^' + a.title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*'), ''))}</li>`).join('')}</ul>
          </div>
        </section>
        <section>
          <div class="block">
            <h2>Good articles</h2>
            <ul class="ga">${ga.map(a => `<li><a href="${href(a.slug)}">${esc(a.title)}</a></li>`).join('')}</ul>
          </div>
          <div class="block">
            <h2>Browse by quality</h2>
            <ul class="classes">${CLASSES.map(c => `<li><a href="#Class.${c.id}"><span class="chip ${c.id}">${c.id === 'FA' ? '★ ' : ''}${esc(c.short)}</span><span>${esc(c.name)}</span><span class="n">${count(c.id)}</span></a></li>`).join('')}</ul>
          </div>
        </section>
        <section class="wide block">
          <h2>Browse by subject <a href="#Special.All">All articles A–Z</a></h2>
          <div class="subjects">${subj.map(([s, cats]) => `
            <div><h3><a href="#Subject.${categorySlug(s)}">${esc(s)}</a><span>${cats.reduce((n, c) => n + c[1].length, 0)}</span></h3>
            <ul>${cats.slice(0, 6).map(([c, l]) => `<li><a href="#Category.${categorySlug(c)}">${esc(c)}</a><span>${l.length}</span></li>`).join('')}
            ${cats.length > 6 ? `<li><a href="#Subject.${categorySlug(s)}">${cats.length - 6} more categor${cats.length - 6 === 1 ? 'y' : 'ies'}…</a></li>` : ''}</ul></div>`).join('')}
          </div>
        </section>
      </div>`;
    if (fa && firstPara) {
      const p = $('#faText');
      p.innerHTML = toHtml(firstPara);
      p.querySelectorAll('sup').forEach(s => s.remove());
    }
    $('#moreDyk').addEventListener('click', e => { e.preventDefault(); const y = scrollY; renderHome(); scrollTo(0, y); });
    return '';
  }

  load();
})();

</script>

</body>
</html>
