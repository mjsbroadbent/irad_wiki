<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Irad Wiki</title>
<script>
  // Apply the saved theme before anything paints. Light is the default.
  try { if (localStorage.getItem('iradwiki-theme') === 'dark') document.documentElement.setAttribute('data-wiki-theme', 'dark'); } catch (e) {}
</script>
<style>
/* Layout: modelled on Wikipedia's current desktop skin. Header with menu,
   wordmark, search and appearance toggle; a left column holding the article's
   Contents (or the main menu elsewhere); a content column with tabs, serif
   headings and a floated infobox. Colours follow Wikipedia's light and night themes. */
:root {
  --bg: #ffffff;
  --gutter: 40px;             /* space between the content and the grey margins */
  --margin: #f8f9fa;          /* page margins outside the content column, as on Wikipedia */
  --text: #202122;
  --text-subtle: #54595d;
  --border: #a2a9b1;
  --border-subtle: #c8ccd1;
  --border-faint: #eaecf0;
  --surface: #f8f9fa;
  --hover: #eaecf0;
  --link: #3366cc;
  --link-visited: #795cb2;
  --link-red: #d73333;
  --progressive: #3366cc;
  --fa: #c99a1a;
  --ga: #2f8a3f;
  --flash: #fef6e7;
  --mp-green-bg: #f5fffa; --mp-green-border: #a3bfb1; --mp-green-head: #cef2e0;
  --mp-blue-bg: #f5faff; --mp-blue-border: #a3b0bf; --mp-blue-head: #cedff2;
  --mp-purple-bg: #faf5ff; --mp-purple-border: #afa3bf; --mp-purple-head: #ddcef2;
  --serif: 'Linux Libertine', 'Libertinus Serif', 'Georgia', 'Times', serif;
  --sans: sans-serif;
  --mono: Menlo, Consolas, 'Liberation Mono', monospace;
  color-scheme: light;
}
:root[data-wiki-theme="dark"] {
  --bg: #101418;
  --margin: #202122;
  --text: #eaecf0;
  --text-subtle: #a2a9b1;
  --border: #72777d;
  --border-subtle: #54595d;
  --border-faint: #27292d;
  --surface: #202122;
  --hover: #27292d;
  --link: #88a3e8;
  --link-visited: #a799cd;
  --link-red: #fd7865;
  --progressive: #6485d1;
  --fa: #e3b94a;
  --ga: #5cb86c;
  --flash: #3a3220;
  --mp-green-bg: #0f1d18; --mp-green-border: #3b5a4d; --mp-green-head: #1d3a2f;
  --mp-blue-bg: #0e1724; --mp-blue-border: #3d4f66; --mp-blue-head: #1d3049;
  --mp-purple-bg: #191424; --mp-purple-border: #574a6b; --mp-purple-head: #33264a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--margin); color: var(--text); }
/* The header, page and footer form one centred column on the page colour; wider screens show grey margins either side. */
.vh, .page, .foot { background: var(--bg); width: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
.page { flex: 1 0 auto; }
body { font-family: var(--sans); font-size: 0.875rem; line-height: 1.6; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--progressive); outline-offset: 1px; }
button { font: inherit; color: inherit; }
.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Header */
.vh { max-width: 1440px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 8px; display: flex; align-items: center; gap: 12px; min-height: 56px; }
.icon-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; border-radius: 2px; padding: 6px; cursor: pointer; color: var(--text); }
.icon-btn:hover { background: var(--hover); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); flex: none; margin-right: 12px; }
.brand:hover { text-decoration: none; }
.brand img { width: 44px; height: auto; display: block; border: 1px solid var(--border-faint); }
.wordmark { display: flex; flex-direction: column; line-height: 1; }
.wordmark b { font: 400 1.35rem/1 var(--serif); letter-spacing: .14em; text-transform: uppercase; }
.wordmark small { font: 400 .78rem/1 var(--serif); letter-spacing: .03em; margin-top: 4px; }
.search { position: relative; display: flex; flex: 1; max-width: 500px; }
.search input { flex: 1; min-width: 0; font: inherit; font-size: .875rem; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-right: 0; border-radius: 2px 0 0 2px; padding: 6px 8px 6px 32px; height: 32px; }
.search input:focus { outline: none; border-color: var(--progressive); box-shadow: inset 0 0 0 1px var(--progressive); }
.search .mag { position: absolute; left: 8px; top: 7px; width: 18px; height: 18px; color: var(--text-subtle); pointer-events: none; }
.search button { font-weight: 700; padding: 0 12px; height: 32px; border: 1px solid var(--border); border-radius: 0 2px 2px 0; background: var(--surface); cursor: pointer; }
.search button:hover { background: var(--hover); }
.suggest { position: absolute; left: 0; right: 0; top: 32px; margin: 0; padding: 0; list-style: none; background: var(--bg); border: 1px solid var(--border); box-shadow: 0 2px 2px rgb(0 0 0 / .1); z-index: 30; }
.suggest a { display: flex; flex-direction: column; padding: 6px 12px; color: var(--text); }
.suggest a:hover, .suggest li.on a { background: var(--hover); text-decoration: none; }
.suggest a b { font-weight: 700; }
.suggest a small { color: var(--text-subtle); font-size: .8rem; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.suggest .all a { flex-direction: row; gap: 8px; align-items: center; border-top: 1px solid var(--border-faint); color: var(--text); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.theme-btn span { font-size: .875rem; }

/* Main menu dropdown */
.menu-panel { position: absolute; z-index: 25; top: 56px; left: max(var(--gutter), calc((100vw - 1440px) / 2 + var(--gutter))); width: 230px; max-height: calc(100vh - 80px); overflow-y: auto; background: var(--bg); border: 1px solid var(--border); box-shadow: 0 2px 4px rgb(0 0 0 / .15); padding: 12px 16px; }

/* Shared menu / contents lists */
.nav-h { display: flex; justify-content: space-between; align-items: baseline; font-size: .875rem; font-weight: 700; padding-bottom: 6px; margin: 0 0 6px; border-bottom: 1px solid var(--border-faint); }
.nav-sub { color: var(--text-subtle); font-size: .75rem; font-weight: 700; margin: 14px 0 4px; }
.nav-list { list-style: none; margin: 0; padding: 0; }
.nav-list li { padding: 3px 0; line-height: 1.35; }
.nav-list a.here { color: var(--text); font-weight: 700; }
.nav-list .n { color: var(--text-subtle); font-size: .78rem; margin-left: 4px; }

/* Page grid */
.page { max-width: 1440px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 8px 0; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; }
.side { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 24px); overflow-y: auto; padding: 8px 4px 24px 0; font-size: .875rem; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc li a { display: block; padding: 4px 0; color: var(--link); line-height: 1.3; }
.toc li a.active { color: var(--text); font-weight: 700; }
main { min-width: 0; padding-bottom: 32px; }

/* Article chrome */
.title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--border); padding-top: 10px; }
.firstHeading { font: 400 1.8rem/1.375 var(--serif); margin: 0 0 2px; overflow-wrap: anywhere; }
.indicators { display: flex; gap: 6px; padding-bottom: 8px; }
.indicators a { display: inline-flex; }
.indicators svg { width: 20px; height: 20px; }
.tabs { display: flex; justify-content: space-between; gap: 12px; font-size: .875rem; margin-bottom: 4px; }
.tabs nav { display: flex; gap: 16px; }
.tabs a { padding: 6px 0 5px; color: var(--link); border-bottom: 2px solid transparent; }
.tabs a.sel { color: var(--text); border-bottom-color: var(--text); }
.tabs a:hover { text-decoration: none; border-bottom-color: var(--border); }
.tabs a.sel:hover { border-bottom-color: var(--text); }
.siteSub { color: var(--text-subtle); font-size: .875rem; margin: 6px 0 14px; }

/* Article body */
.prose { font-size: 1rem; line-height: 1.6; max-width: 960px; }
.prose::after { content: ''; display: table; clear: both; }
.prose p { margin: .5em 0 1em; }
.prose h2 { font: 400 1.5em/1.375 var(--serif); margin: 1em 0 .25em; padding-bottom: 2px; border-bottom: 1px solid var(--border); overflow: hidden; scroll-margin-top: 12px; }
.prose h3, .prose h4 { font-family: var(--sans); font-weight: 700; font-size: 1.125em; line-height: 1.6; margin: .3em 0 0; padding-top: .5em; scroll-margin-top: 12px; }
.prose h4 { font-size: 1em; }
.prose a.wl:visited { color: var(--link-visited); }
.prose a.red, .prose a.red:visited { color: var(--link-red); }
.prose sup { font-size: .75em; line-height: 1; vertical-align: super; }
.prose sup.cite { color: var(--link); cursor: pointer; white-space: nowrap; }
.prose sup.cite:hover { text-decoration: underline; }
.prose ul, .prose ol { margin: .3em 0 .5em 1.6em; padding: 0; }
.prose li { margin-bottom: .1em; }
.prose blockquote { margin: 1em 0; padding: 0 1.6em; border: 0; }
.prose hr { border: 0; border-top: 1px solid var(--border); margin: 1em 0; }
.prose code { font-family: var(--mono); font-size: .9em; background: var(--surface); border: 1px solid var(--border-faint); padding: 1px 4px; border-radius: 2px; }
.prose pre { font-family: var(--mono); font-size: .875em; background: var(--surface); border: 1px solid var(--border-faint); padding: 14px; overflow-x: auto; line-height: 1.4; }
.prose ol.references { font-size: .9em; margin-left: 2em; }
.prose ol.references li { margin-bottom: .2em; }
.prose ol.references li b { font-weight: 700; color: var(--link); margin-right: 2px; }
.prose li.flash { background: var(--flash); }
.tbl { overflow-x: auto; margin: 1em 0; }
.prose table { border-collapse: collapse; background: var(--surface); color: var(--text); border: 1px solid var(--border); font-size: .95em; }
.prose th, .prose td { border: 1px solid var(--border); padding: .2em .4em; text-align: left; vertical-align: top; }
.prose th { background: var(--hover); font-weight: 700; text-align: center; }
.hatnote { font-style: italic; padding-left: 1.6em; margin: 0 0 .5em; }
.stub-note { display: flex; gap: 10px; align-items: center; margin: 1.6em 0 .5em; font-size: .875rem; font-style: italic; }
.stub-note svg { width: 28px; height: 28px; flex: none; stroke: var(--text-subtle); }
.inline-toc { display: none; border: 1px solid var(--border); background: var(--surface); padding: 6px 12px; margin: 1em 0; font-size: .9rem; }
.inline-toc summary { font-weight: 700; cursor: pointer; }
.inline-toc ol { margin: 6px 0 4px 1.4em; padding: 0; }

.infobox { float: right; clear: right; width: 22em; margin: .5em 0 .5em 1em; padding: .2em; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 88%; line-height: 1.5; }
.infobox .above { font-size: 125%; font-weight: 700; text-align: center; padding: .2em; line-height: 1.3; }
.infobox .above span { display: block; font-size: 80%; font-weight: 400; margin-top: 2px; }
.infobox figure { margin: .4em 0; text-align: center; }
.infobox figure img { width: 220px; max-width: 100%; border: 1px solid var(--border-subtle); }
/* Article thumbnails, after Wikipedia's "thumb" frames */
.prose figure.thumb { float: right; clear: right; max-width: 100%; margin: .4em 0 1.2em 1.4em; padding: 3px; border: 1px solid var(--border-subtle); background: var(--surface); font-size: 88%; line-height: 1.4; }
.prose figure.thumb img { display: block; width: 100%; height: auto; border: 1px solid var(--border-faint); background: #fff; }
.prose figure.thumb figcaption { padding: 4px 3px 2px; color: var(--text); }
.prose figure.thumb.lead { margin-top: 0; }
.infobox figure.locator { border-top: 1px solid var(--border-faint); padding-top: .4em; }
.infobox figure.locator img { width: 250px; height: auto; border: 0; vertical-align: middle; }
.infobox figcaption { font-size: 95%; line-height: 1.35; padding: 0 .4em; }
.infobox dl { margin: 0; display: grid; grid-template-columns: 38% minmax(0, 1fr); gap: 0 6px; }
.infobox dt, .infobox dd { padding: .25em .2em; border-top: 1px solid var(--border-faint); }
.infobox dt { font-weight: 700; }
.infobox dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.infobox ul { list-style: none; margin: 0; padding: 0; }
.infobox ul li::before { content: '• '; }

.catlinks { clear: both; border: 1px solid var(--border); background: var(--surface); padding: 5px 8px; margin-top: 1.5em; font-size: .875rem; }
.catlinks ul { display: inline; margin: 0; padding: 0; list-style: none; }
.catlinks li { display: inline; }
.catlinks li + li::before { content: ' | '; color: var(--text-subtle); }
.backlinks { margin-top: 1em; font-size: .875rem; }
.backlinks summary { cursor: pointer; color: var(--link); }
.backlinks ul { columns: 3 200px; column-gap: 24px; margin: 8px 0 0; padding: 0; list-style: none; }
.backlinks li { break-inside: avoid; padding: 1px 0; }

/* Source view */
.source-note { font-size: .875rem; margin: 0 0 10px; }
.source-view { font-family: var(--mono); font-size: .82rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface); color: var(--text); border: 1px solid var(--border-subtle); padding: 12px; margin: 0; max-height: 75vh; overflow-y: auto; }

/* Category / list pages */
.cat-intro { font-size: 1rem; margin: .5em 0 1em; max-width: 960px; }
.cat-h2 { font: 400 1.5em/1.375 var(--serif); margin: 1em 0 .4em; border-bottom: 1px solid var(--border); }
.cat-cols { columns: 3 220px; column-gap: 24px; font-size: .95rem; }
.cat-cols h3 { font-size: 1.1em; margin: 0; padding-top: .4em; break-after: avoid; }
.cat-cols ul { margin: 0 0 .6em 1.4em; padding: 0; }
.cat-cols li { break-inside: avoid; }
.subcats { list-style: none; margin: 0; padding: 0; columns: 2 260px; font-size: .95rem; }
.subcats li { padding: 1px 0; break-inside: avoid; }
.subcats li::before { content: '▸ '; color: var(--text-subtle); }
.subcats small { color: var(--text-subtle); }
.az-letters { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 1rem; margin: .5em 0 1em; }
.az-letters button { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; }
.az-letters button:hover { text-decoration: underline; }
.az-h { scroll-margin-top: 12px; }

/* Search results */
.results { list-style: none; margin: 0; padding: 0; max-width: 760px; }
.results li { margin-bottom: 1.1em; font-size: .9rem; }
.results .r-title { font-size: 1.1rem; }
.results .r-snip { line-height: 1.45; }
.results .searchmatch { font-weight: 700; }
.results .r-data { color: var(--text-subtle); font-size: .8rem; }
.search-big { display: flex; max-width: 620px; margin: .8em 0 1em; }
.search-big input { flex: 1; min-width: 0; font: inherit; font-size: 1rem; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-right: 0; border-radius: 2px 0 0 2px; padding: 6px 8px; }
.search-big button { font-weight: 700; padding: 0 14px; border: 1px solid var(--progressive); border-radius: 0 2px 2px 0; background: var(--progressive); color: var(--bg); cursor: pointer; }
.r-count { color: var(--text-subtle); border-bottom: 1px solid var(--border-faint); padding-bottom: 6px; margin-bottom: 1em; max-width: 760px; }

/* Main page */
.mp-welcome { border: 1px solid var(--border); background: var(--surface); text-align: center; padding: 12px 16px 10px; margin: 10px 0 12px; }
.mp-welcome .hello { font: 400 1.85rem/1.25 var(--serif); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mp-box .recent { margin: .4em 0 0; }
.foot-in code { font-family: var(--mono); font-size: .95em; }
.mp-welcome p { margin: 4px 0 0; font-size: .9rem; }
.mp-grid { display: grid; grid-template-columns: minmax(0, 55fr) minmax(0, 45fr); gap: 12px; align-items: start; }
.mp-col { display: grid; gap: 12px; min-width: 0; }
.mp-box { border: 1px solid; padding: 0 10px 10px; font-size: .95rem; min-width: 0; }
.mp-box > h2 { font: 700 1.05rem/1.4 var(--sans); margin: 0 -10px 8px; padding: 3px 8px; border-bottom: 1px solid; }
.mp-green { background: var(--mp-green-bg); border-color: var(--mp-green-border); }
.mp-green > h2 { background: var(--mp-green-head); border-color: var(--mp-green-border); }
.mp-blue { background: var(--mp-blue-bg); border-color: var(--mp-blue-border); }
.mp-blue > h2 { background: var(--mp-blue-head); border-color: var(--mp-blue-border); }
.mp-purple { background: var(--mp-purple-bg); border-color: var(--mp-purple-border); margin-top: 12px; }
.mp-purple > h2 { background: var(--mp-purple-head); border-color: var(--mp-purple-border); }
.mp-tfa::after { content: ''; display: table; clear: both; }
.mp-tfa img { float: left; width: 110px; margin: 4px 12px 6px 0; border: 1px solid var(--border-subtle); }
.mp-tfa p { margin: 0 0 .5em; }
.mp-box ul { margin: 0 0 0 1.4em; padding: 0; }
.mp-box li { margin-bottom: .35em; }
.mp-more { text-align: right; font-size: .875rem; margin-top: 6px; }
.mp-classes { list-style: none; margin: 0 !important; display: grid; gap: 3px; }
.mp-classes li { display: flex; align-items: center; gap: 8px; margin: 0 !important; }
.mp-classes svg { width: 16px; height: 16px; flex: none; }
.mp-classes .n { color: var(--text-subtle); margin-left: auto; font-variant-numeric: tabular-nums; }
.mp-subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 22px; }
.mp-subjects h3 { font-size: .95rem; margin: 0 0 2px; }
.mp-subjects p { margin: 0; font-size: .875rem; line-height: 1.5; }
.mp-other { font-size: .9rem; margin-top: 18px; }
.mp-other h2 { font: 400 1.5em/1.375 var(--serif); border-bottom: 1px solid var(--border); margin: 0 0 .4em; }
.mp-other ul { margin: 0 0 0 1.4em; padding: 0; columns: 2 280px; }

/* Status */
.status { max-width: 520px; margin: 12vh auto; text-align: center; color: var(--text-subtle); }
.status img { width: 110px; border: 1px solid var(--border-faint); margin-bottom: 14px; }
.status h1 { font: 400 1.6rem/1.3 var(--serif); color: var(--text); margin: 0 0 6px; }
.status code { font-family: var(--mono); background: var(--surface); padding: 1px 4px; }
.status.err { text-align: left; }
.bar { height: 3px; background: var(--border-faint); margin-top: 14px; }
.bar i { display: block; height: 100%; width: 0; background: var(--progressive); transition: width .25s; }

/* Footer */
.foot { max-width: 1440px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 0 32px; }
.foot-in { margin-left: 248px; border-top: 1px solid var(--border-subtle); padding-top: 12px; font-size: .75rem; color: var(--text); }
.foot-in p { margin: 0 0 6px; }
.foot-in ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; }

@media (max-width: 1000px) {
  :root { --gutter: 24px; }
  .page { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .inline-toc { display: block; }
  .foot-in { margin-left: 0; }
  .mp-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  :root { --gutter: 16px; }
  .wordmark small, .theme-btn span { display: none; }
  .wordmark b { font-size: 1.05rem; letter-spacing: .1em; }
  .brand { margin-right: 0; }
  .brand img { width: 34px; }
  .search button { display: none; }
  .search input { border-right: 1px solid var(--border); border-radius: 2px; }
  .infobox { float: none; width: auto; margin: .5em 0 1em; }
  .prose figure.thumb { float: none; margin: .5em auto 1em; }
  .firstHeading { font-size: 1.6rem; }
  .mp-tfa img { width: 80px; }
}
@media (max-width: 420px) {
  .wordmark { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<header class="vh">
  <button class="icon-btn" id="menuBtn" type="button" aria-label="Main menu" aria-expanded="false" aria-controls="menuPanel" title="Main menu">
    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
  </button>
  <a class="brand" href="#" aria-label="Irad Wiki main page">
    <img src="webflag.svg" alt="">
    <span class="wordmark"><b>Irad Wiki</b><small>The Free Encyclopedia</small></span>
  </a>
  <form class="search" id="searchForm" role="search" autocomplete="off">
    <svg class="icon mag" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m17 17-4.5-4.5"/></svg>
    <input id="q" type="search" placeholder="Search Irad Wiki" aria-label="Search Irad Wiki" aria-controls="suggest" aria-expanded="false">
    <button type="submit">Search</button>
    <ul class="suggest" id="suggest" role="listbox" hidden></ul>
  </form>
  <div class="tools">
    <button class="icon-btn theme-btn" id="themeBtn" type="button"></button>
  </div>
</header>
<div class="menu-panel" id="menuPanel" hidden></div>

<div class="page">
  <aside class="side" id="side" aria-label="Page navigation"></aside>
  <main id="main">
    <div class="status">
      <img src="webflag.svg" alt="">
      <h1>Opening the encyclopedia</h1>
      <div id="loadMsg">Loading the article volumes…</div>
      <div class="bar"><i id="loadBar"></i></div>
    </div>
  </main>
</div>
<footer class="foot"><div class="foot-in" id="foot"></div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.min.js"></script>
<script>
/* Irad Wiki core: splits the volume files into articles. No DOM access, so it
   also runs in Node for testing. Edit VOLUMES if file names or layout change. */

const VOLUMES = [
  {
    file: 'Irad_Wiki_Vol1_Core.md',
    label: 'Volume 1',
    // "### 2.1. Talas" — the featured article is plain "### Irad"
    article: /^### (?:(\d+\.\d+)\.\s+)?(.+?)\s*$/,
  },
  {
    file: 'Irad_Wiki_Vol2_C_Class.md',
    label: 'Volume 2',
    article: /^### (\d+\.\d+)\.\s+(.+?)\s*$/,
  },
  {
    file: 'Irad_Wiki_Vol3_Start_Stub.md',
    label: 'Volume 3',
    // "### 5.Category: Biographies & Leadership (36 articles)"
    category: /^### \d+\.Category:\s*(.+?)\s*\(\d+ articles?\)\s*$/,
    // "#### 1. Mar Timotheos Alimbekov"
    article: /^#### (\d+)\.\s+(.+?)\s*$/,
  },
];

// "## 3. B-Class Articles (43 Entries)" starts a quality class section.
const CLASS_HEADING = /^## \d+\.\s+(.+?)\s*$/;
const META_LINE = /^\*Quality(?: Assessment)?:\s*(.+?)\s*\|\s*Category:\s*(.+?)\s*\*\s*$/;
const STUB_TEMPLATE = /\{\{\s*([^}]+?)\s*\}\}/g;
const WIKILINK = /\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g;

const CLASSES = [
  { id: 'FA', name: 'Featured articles', short: 'Featured', blurb: 'The best articles in the wiki, reviewed for completeness, sourcing and prose.' },
  { id: 'GA', name: 'Good articles', short: 'Good', blurb: 'Well-written, broad and properly sourced articles that meet the good-article criteria.' },
  { id: 'B', name: 'B-Class articles', short: 'B-Class', blurb: 'Mostly complete articles on the principal people, places and institutions of Irad.' },
  { id: 'C', name: 'C-Class articles', short: 'C-Class', blurb: 'Substantial articles that still have gaps in coverage or sourcing.' },
  { id: 'Start', name: 'Start-Class articles', short: 'Start', blurb: 'Developing articles with a basic outline and some sources.' },
  { id: 'Stub', name: 'Stub articles', short: 'Stub', blurb: 'Short entries of a paragraph or two, mostly terms, places and minor figures.' },
];

function classFromHeading(text) {
  if (/featured/i.test(text)) return 'FA';
  if (/good/i.test(text)) return 'GA';
  if (/\bB-Class/i.test(text)) return 'B';
  if (/\bC-Class/i.test(text)) return 'C';
  if (/start/i.test(text)) return 'Start';
  if (/stub/i.test(text)) return 'Stub';
  return null;
}

/* Broad subject for a category name, used to group the many category names
   on the main page. Keyed on the first word of the category. */
const SUBJECTS = {
  Biographies: 'People', Biography: 'People', Historical: 'People',
  History: 'History',
  Culture: 'Culture & arts', Cultural: 'Culture & arts', Arts: 'Culture & arts', Language: 'Culture & arts',
  Media: 'Culture & arts', National: 'Culture & arts',
  Religion: 'Religion',
  Politics: 'Politics & law', Regions: 'Politics & law', Security: 'Politics & law', Military: 'Politics & law',
  Institutions: 'Politics & law', Public: 'Politics & law',
  Economy: 'Economy', Agriculture: 'Economy', Education: 'Economy',
  Infrastructure: 'Infrastructure', Transport: 'Infrastructure',
  Geography: 'Places', Cities: 'Places', Minor: 'Places', Nation: 'Places', Demographics: 'Places',
  Physical: 'Nature', Nature: 'Nature', Wildlife: 'Nature', Equines: 'Nature', Science: 'Nature',
};
function subjectOf(category) {
  const w = category.split(/[\s,&]+/)[0];
  return SUBJECTS[w] || 'Other';
}

function slugOf(title) { return title.replace(/\s+/g, '_'); }
function categorySlug(name) { return name.replace(/&/g, 'and').replace(/[^\p{L}\p{N}]+/gu, '_').replace(/^_|_$/g, ''); }
function fold(s) {
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ı/g, 'i').replace(/[’‘]/g, "'").toLowerCase();
}

function parseVolume(text, cfg, volIndex) {
  const lines = text.split(/\r?\n/);
  const articles = [];
  const pre = [];
  let cls = null, cat = null, cur = null, inFence = false;

  const close = () => {
    if (!cur) return;
    finishArticle(cur);
    articles.push(cur);
    cur = null;
  };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^```/.test(line)) inFence = !inFence;
    if (!inFence) {
      let m = line.match(CLASS_HEADING);
      if (m && classFromHeading(m[1])) { close(); cls = classFromHeading(m[1]); cat = null; continue; }
      if (cfg.category && (m = line.match(cfg.category))) { close(); cat = m[1]; continue; }
      if ((m = line.match(cfg.article))) {
        close();
        cur = { title: m[2], number: m[1] || '', cls, heading: cat, vol: volIndex, line: i + 1, lines: [] };
        continue;
      }
    }
    (cur ? cur.lines : pre).push(line);
  }
  close();
  return { articles, pre: pre.join('\n') };
}

function finishArticle(a) {
  const ls = a.lines;
  // quality / category line near the top
  for (let i = 0; i < Math.min(ls.length, 4); i++) {
    const m = ls[i].match(META_LINE);
    if (m) { a.category = m[2]; ls.splice(i, 1); break; }
  }
  if (!a.category) a.category = a.heading || 'Uncategorized';
  while (ls.length && /^\s*(---)?\s*$/.test(ls[ls.length - 1])) ls.pop();
  while (ls.length && /^\s*$/.test(ls[0])) ls.shift();
  a.src = ls.join('\n');
  delete a.lines;
  const stub = a.src.match(/\{\{\s*([^}]*?stub[^}]*?)\s*\}\}/i);
  a.stubType = stub ? stub[1] : null;
  a.slug = slugOf(a.title);
  a.links = new Set();
  for (const m of a.src.matchAll(WIKILINK)) a.links.add(m[1].trim());
}

/* Plain text of an article for search and summaries. */
function plainText(src) {
  return src
    .replace(/<sup>.*?<\/sup>/g, '')
    .replace(/<ol class="references">[\s\S]*?<\/ol>/g, '')
    .replace(WIKILINK, (_, t, l) => l || t)
    .replace(STUB_TEMPLATE, '')
    .replace(/<[^>]+>/g, '')
    .replace(/^#+\s*/gm, '')
    .replace(/^\|.*\|$/gm, m => m.replace(/\|/g, ' ').replace(/-{3,}/g, ''))
    .replace(/[*_`]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function lede(src, max = 170) {
  const para = src.split(/\n\s*\n/).find(p => p.trim() && !/^\s*(#|<|\{\{|\||```)/.test(p)) || '';
  let t = plainText(para);
  if (t.length > max) {
    const cut = t.lastIndexOf(' ', max);
    t = t.slice(0, cut > 60 ? cut : max).replace(/[,;:]$/, '') + '…';
  }
  return t;
}

/* Builds the whole wiki from the volume texts (same order as VOLUMES). */
function buildWiki(texts) {
  const wiki = { articles: [], bySlug: new Map(), byFold: new Map(), categories: new Map(), backlinks: new Map(), pre: [], warnings: [] };
  texts.forEach((text, vi) => {
    const { articles, pre } = parseVolume(text, VOLUMES[vi], vi);
    wiki.pre.push(pre);
    for (const a of articles) {
      if (wiki.bySlug.has(a.slug)) wiki.warnings.push(`Duplicate title "${a.title}" (${VOLUMES[vi].file}, line ${a.line}); the first copy is shown.`);
      else { wiki.bySlug.set(a.slug, a); wiki.byFold.set(fold(a.title), a); }
      wiki.articles.push(a);
      if (!wiki.categories.has(a.category)) wiki.categories.set(a.category, []);
      wiki.categories.get(a.category).push(a);
    }
  });
  for (const a of wiki.articles) {
    for (const t of a.links) {
      const target = resolve(wiki, t);
      if (!target || target === a) continue;
      if (!wiki.backlinks.has(target.slug)) wiki.backlinks.set(target.slug, new Set());
      wiki.backlinks.get(target.slug).add(a);
    }
  }
  return wiki;
}

function resolve(wiki, title) {
  return wiki.bySlug.get(slugOf(title.trim())) || wiki.byFold.get(fold(title.trim())) || null;
}

/* Turns the "Country Overview" code block into infobox rows. */
function parseInfobox(block) {
  const parts = block.split(/^=+\s*$/m).map(s => s.replace(/^\n+|\n+$/g, '')).filter(Boolean);
  if (parts.length < 2) return null;
  const head = parts[0].split('\n');
  const box = { name: head[0].trim(), subtitle: head.slice(1).join(' ').trim(), rows: [] };
  let last = null, lastItem = null;
  const join = (prev, next) => prev + ' ' + next;
  for (const raw of parts[1].split('\n')) {
    if (!raw.trim()) continue;
    if (/^\s*•/.test(raw) && last) {
      const t = raw.replace(/^\s*•\s*/, '');
      const m = t.match(/^([^:]{1,40}):\s*(.+)$/);
      lastItem = m ? { label: m[1], value: m[2] } : { label: '', value: t };
      last.items.push(lastItem);
    } else if (/^\s/.test(raw) && last) {
      const t = raw.trim();
      if (lastItem) lastItem.value = join(lastItem.value, t); else last.value = join(last.value, t);
    } else {
      for (const seg of raw.split(/\s+\|\s+/)) {
        const m = seg.match(/^([^:]{1,70}?):\s*(.*)$/);
        if (m) { last = { key: m[1].trim(), value: m[2].trim(), items: [] }; lastItem = null; box.rows.push(last); }
        else if (last) last.value = join(last.value, seg.trim());
      }
    }
  }
  for (const r of box.rows) r.value = r.value.replace(/\s*\(webflag\.svg\)/, '');
  return box;
}

if (typeof module !== 'undefined') module.exports = { VOLUMES, CLASSES, subjectOf, buildWiki, parseInfobox, plainText, lede, fold, slugOf, categorySlug, resolve, WIKILINK, STUB_TEMPLATE };

</script>
<script>
/* Irad Wiki app: loading, routing and rendering. Depends on core.js and markdown-it. */
(function () {
  'use strict';
  const BASE = './';                 // folder that holds the volume files and webflag.svg
  const FLAG = BASE + 'webflag.svg';
  // Images are listed in images/images.json (file, article, section or placement, width, caption, alt).
  // As on Wikipedia, articles show PNG thumbnails at 1x and 2x and link to the full file.
  const IMAGES = BASE + 'images/';
  const THEME_KEY = 'iradwiki-theme';
  const $ = s => document.querySelector(s);
  const main = $('#main'), side = $('#side'), foot = $('#foot'), menuPanel = $('#menuPanel');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const href = slug => '#' + encodeURIComponent(slug).replace(/%2C/g, ',').replace(/%3A/g, ':');
  const classOf = id => CLASSES.find(c => c.id === id);
  const collator = new Intl.Collator('en', { sensitivity: 'base', numeric: true });
  const sortKey = t => t.replace(/^the\s+/i, '');
  const byTitle = (a, b) => collator.compare(sortKey(a.title), sortKey(b.title));
  const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const plural = (n, one, many) => `${n.toLocaleString('en')} ${n === 1 ? one : (many || one + 's')}`;

  let wiki = null, md = null, infobox = null, query = '', searchIndex = null, images = [];
  const ledeCache = new Map();
  const ledeOf = a => { if (!ledeCache.has(a)) ledeCache.set(a, lede(a.src)); return ledeCache.get(a); };

  /* ---------- icons ---------- */
  const ICON = {
    FA: '<svg viewBox="0 0 20 20" aria-hidden="true"><path fill="var(--fa)" stroke="var(--fa)" stroke-width="1" stroke-linejoin="round" d="m10 1.8 2.5 5.3 5.7.7-4.2 4 1.1 5.7L10 14.7l-5.1 2.8L6 11.8 1.8 7.8l5.7-.7z"/></svg>',
    GA: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="var(--ga)"/><path d="M10 5.5v9M5.5 10h9" stroke="var(--bg)" stroke-width="2.4" stroke-linecap="round"/></svg>',
    dot: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4" fill="var(--border)"/></svg>',
    moon: '<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7Z"/></svg>',
    sun: '<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.5"/><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6 16 16M4 16l1.4-1.4M14.6 5.4 16 4"/></svg>',
    search: '<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m17 17-4.5-4.5"/></svg>',
    stub: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>',
  };

  /* ---------- theme ---------- */
  const themeBtn = $('#themeBtn');
  function currentTheme() { return document.documentElement.getAttribute('data-wiki-theme') === 'dark' ? 'dark' : 'light'; }
  function paintThemeBtn() {
    const dark = currentTheme() === 'dark';
    themeBtn.innerHTML = dark ? `${ICON.sun}<span>Light</span>` : `${ICON.moon}<span>Dark</span>`;
    themeBtn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    themeBtn.title = themeBtn.getAttribute('aria-label');
  }
  themeBtn.addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    if (next === 'dark') document.documentElement.setAttribute('data-wiki-theme', 'dark');
    else document.documentElement.removeAttribute('data-wiki-theme');
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* storage unavailable: the choice lasts for this visit */ }
    paintThemeBtn();
  });
  paintThemeBtn();

  /* ---------- loading ---------- */
  async function load() {
    if (!window.markdownit) return fail('The Markdown library did not load. Check your internet connection, then reload the page.');
    md = window.markdownit({ html: true, linkify: false, typographer: false });
    let done = 0;
    const bar = $('#loadBar'), msg = $('#loadMsg');
    // The image list is optional: without it, articles simply show no images.
    const imageList = fetch(IMAGES + 'images.json').then(r => (r.ok ? r.json() : [])).catch(() => []);
    try {
      const texts = await Promise.all(VOLUMES.map(async v => {
        const r = await fetch(BASE + v.file);
        if (!r.ok) throw new Error(`${v.file} returned ${r.status} ${r.statusText}`);
        const t = await r.text();
        done++;
        bar.style.width = (done / VOLUMES.length * 100) + '%';
        msg.textContent = `Loaded ${done} of ${VOLUMES.length} volumes`;
        return t;
      }));
      wiki = buildWiki(texts);
    } catch (e) {
      const local = location.protocol === 'file:';
      return fail(local
        ? 'Browsers block a page opened straight from disk from reading the volume files. Serve the folder over HTTP instead, for example with <code>python3 -m http.server</code> in this folder, then open <code>http://localhost:8000</code>.'
        : `Couldn't read the article volumes (${esc(e.message)}). Make sure the three <code>Irad_Wiki_Vol…md</code> files sit in the same folder as this page.`);
    }
    images = await imageList;
    if (wiki.warnings.length) console.warn('Irad Wiki:\n' + wiki.warnings.join('\n'));
    const block = (wiki.pre[0] || '').match(/```\s*\n([\s\S]*?)```/);
    infobox = block ? parseInfobox(block[1]) : null;
    wiki.sorted = [...wiki.articles].sort(byTitle);
    wiki.subjects = new Map();
    for (const [cat, list] of wiki.categories) {
      const s = subjectOf(cat);
      if (!wiki.subjects.has(s)) wiki.subjects.set(s, new Map());
      wiki.subjects.get(s).set(cat, list);
    }
    wiki.subjectOrder = [...wiki.subjects.keys()].sort((a, b) => subjectSize(b) - subjectSize(a));
    wiki.catBySlug = new Map([...wiki.categories.keys()].map(c => [categorySlug(c), c]));
    wiki.subjBySlug = new Map([...wiki.subjects.keys()].map(s => [categorySlug(s), s]));
    route();
  }
  function subjectSize(s) { return [...wiki.subjects.get(s).values()].reduce((n, l) => n + l.length, 0); }
  function classCount(id) { return wiki.articles.filter(a => a.cls === id).length; }

  function fail(html) {
    main.innerHTML = `<div class="status err"><img src="${FLAG}" alt=""><h1>The wiki couldn't load</h1><p>${html}</p></div>`;
  }

  /* ---------- routing ---------- */
  let byClick = false, current = null;
  const scrolls = new Map();
  addEventListener('scroll', () => { if (current !== null) scrolls.set(current, scrollY); spy(); }, { passive: true });
  document.addEventListener('click', e => { if (e.target.closest('a[href^="#"]')) byClick = true; });
  addEventListener('hashchange', route);

  function route() {
    if (!wiki) return;
    let key = '';
    try { key = decodeURIComponent(location.hash.slice(1)); } catch { key = location.hash.slice(1); }
    const fresh = byClick; byClick = false;
    current = key;
    closeSuggest(); closeMenu();
    headings = [];

    if (key === 'Special.Random') {
      const a = wiki.articles[Math.floor(Math.random() * wiki.articles.length)];
      location.replace(href(a.slug));
      return;
    }
    let title, article = null;
    const art = k => wiki.bySlug.get(k) || resolve(wiki, k.replace(/_/g, ' '));
    if (!key) title = renderHome();
    else if (key === 'Special.All') title = renderIndex();
    else if (key === 'Special.Search') title = renderSearch();
    else if (key.startsWith('Class.') && classOf(key.slice(6))) title = renderClass(key.slice(6));
    else if (key.startsWith('Category.') && wiki.catBySlug.has(key.slice(9))) title = renderCategory(wiki.catBySlug.get(key.slice(9)));
    else if (key.startsWith('Subject.') && wiki.subjBySlug.has(key.slice(8))) title = renderSubject(wiki.subjBySlug.get(key.slice(8)));
    else if (key.endsWith('~source') && (article = art(key.slice(0, -7)))) title = renderSource(article);
    else if ((article = art(key))) title = renderArticle(article);
    else title = renderMissing(key);

    document.title = title ? `${title} – Irad Wiki` : 'Irad Wiki, the free encyclopedia';
    if (!headings.length) side.innerHTML = `<div class="nav-h">Main menu</div>${menuHtml(key)}`;
    renderFooter(article && !key.endsWith('~source') ? article : null);
    const y = !fresh && scrolls.has(key) ? scrolls.get(key) : 0;
    requestAnimationFrame(() => { scrollTo(0, y); spy(); });
  }

  /* ---------- main menu ---------- */
  function menuHtml(key) {
    const here = k => (k === key ? ' class="here" aria-current="page"' : '');
    return `
      <ul class="nav-list">
        <li><a href="#"${here('')}>Main page</a></li>
        <li><a href="#Special.All"${here('Special.All')}>All pages</a></li>
        <li><a href="#Special.Random">Random article</a></li>
      </ul>
      <div class="nav-sub">Article quality</div>
      <ul class="nav-list">${CLASSES.map(c => `<li><a href="#Class.${c.id}"${here('Class.' + c.id)}>${esc(c.name)}</a><span class="n">${classCount(c.id)}</span></li>`).join('')}</ul>
      <div class="nav-sub">Portals</div>
      <ul class="nav-list">${wiki.subjectOrder.map(s => `<li><a href="#Subject.${categorySlug(s)}"${here('Subject.' + categorySlug(s))}>${esc(s)}</a><span class="n">${subjectSize(s)}</span></li>`).join('')}</ul>`;
  }
  const menuBtn = $('#menuBtn');
  function closeMenu() { menuPanel.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); }
  menuBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (!wiki) return;
    if (!menuPanel.hidden) return closeMenu();
    menuPanel.innerHTML = `<div class="nav-h">Main menu</div>${menuHtml(current)}`;
    menuPanel.hidden = false; menuBtn.setAttribute('aria-expanded', 'true');
  });
  document.addEventListener('click', e => { if (!menuPanel.hidden && !e.target.closest('#menuPanel')) closeMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); closeSuggest(); } });

  /* ---------- contents (scroll-spy) ---------- */
  let headings = [];
  function renderToc(list) {
    headings = list;
    side.innerHTML = `<div class="nav-h">Contents</div>
      <nav class="toc" aria-label="Contents"><ol>
        <li><a href="#" data-to="top">(Top)</a></li>
        ${list.map(h => `<li><a href="#" data-to="${h.id}">${esc(h.text)}</a></li>`).join('')}
      </ol></nav>`;
  }
  side.addEventListener('click', e => {
    const a = e.target.closest('a[data-to]'); if (!a) return;
    e.preventDefault();
    if (a.dataset.to === 'top') scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' });
    else document.getElementById(a.dataset.to)?.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth' });
  });
  function spy() {
    if (!headings.length) return;
    let active = 'top';
    for (const h of headings) {
      const el = document.getElementById(h.id);
      if (el && el.getBoundingClientRect().top < 90) active = h.id;
    }
    side.querySelectorAll('.toc a').forEach(a => a.classList.toggle('active', a.dataset.to === active));
  }

  /* ---------- markdown ---------- */
  const STUB_WORDS = {
    geo: 'the geography of Irad', culture: 'Iradi culture', bio: 'an Iradi person', org: 'an Iradi organization',
    settlement: 'a settlement in Irad', plant: 'a plant of Irad', fauna: 'the animals of Irad', mountain: 'a mountain in Irad',
    craft: 'an Iradi craft', lake: 'a lake in Irad', river: 'a river in Irad', history: 'the history of Irad',
    horse: 'Iradi horses', sport: 'sport in Irad', glacier: 'a glacier in Irad',
  };

  function toHtml(src) {
    // links first, so templates such as {{Hatnote|… see [[Talas River]]}} keep working links
    const pre = src
      .replace(WIKILINK, (_, t, label) => {
        const target = resolve(wiki, t);
        const text = label || t;
        return target
          ? `<a class="wl" href="${href(target.slug)}" title="${esc(target.title)}">${esc(text)}</a>`
          : `<a class="red" href="${href(slugOf(t.trim()))}" title="${esc(t)} (page does not exist)">${esc(text)}</a>`;
      })
      .replace(STUB_TEMPLATE, (_, body) => {
        const [name, ...args] = body.split('|');
        if (/^hatnote$/i.test(name.trim())) return `<div class="hatnote" role="note">${args.join('|')}</div>`;
        const m = name.match(/^Irad-(\w+)-stub$/i);
        if (m || /^Irad-stub$/i.test(name)) {
          const about = m ? (STUB_WORDS[m[1].toLowerCase()] || m[1].toLowerCase() + ' in Irad') : 'Irad';
          return `<div class="stub-note">${ICON.stub}<span>This article about ${about} is a stub. You can help Irad Wiki by expanding it.</span></div>`;
        }
        return `<div class="stub-note">${esc(name)}${args.length ? ': ' + args.join(' | ') : ''}</div>`;
      });
    return md.render(pre);
  }

  /* Wraps tables and makes citation markers clickable. */
  function enhance(root) {
    root.querySelectorAll('table').forEach(t => {
      if (t.parentElement.classList.contains('tbl')) return;
      const w = document.createElement('div'); w.className = 'tbl'; t.replaceWith(w); w.appendChild(t);
    });
    root.querySelectorAll('sup').forEach(s => {
      const m = s.textContent.trim().match(/^\[(\d+)\]$/);
      if (!m) return;
      s.classList.add('cite'); s.tabIndex = 0; s.setAttribute('role', 'link'); s.dataset.n = m[1];
      s.setAttribute('aria-label', `Reference ${m[1]}`);
    });
  }
  main.addEventListener('click', e => { const s = e.target.closest('sup.cite'); if (s) jumpCite(s); });
  main.addEventListener('keydown', e => { const s = e.target.closest('sup.cite'); if (s && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); jumpCite(s); } });
  function jumpCite(s) {
    const li = s.closest('.prose').querySelector(`[id="cite_note-${s.dataset.n}"]`);
    if (!li) return;
    li.scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' });
    li.classList.remove('flash'); void li.offsetWidth; li.classList.add('flash');
    setTimeout(() => li.classList.remove('flash'), 2000);
  }

  /* ---------- article ---------- */
  function indicators(a) {
    if (a.cls === 'FA') return `<a href="#Class.FA" title="This is a featured article. Click here for more information.">${ICON.FA}</a>`;
    if (a.cls === 'GA') return `<a href="#Class.GA" title="This is a good article. Click here for more information.">${ICON.GA}</a>`;
    return '';
  }
  function articleHead(a, view) {
    return `
      <div class="title-row"><h1 class="firstHeading">${view === 'source' ? `View source for ${esc(a.title)}` : esc(a.title)}</h1><div class="indicators">${indicators(a)}</div></div>
      <div class="tabs">
        <nav aria-label="Namespaces"><a class="sel" href="${href(a.slug)}">Article</a></nav>
        <nav aria-label="Views"><a ${view === 'read' ? 'class="sel" aria-current="page"' : ''} href="${href(a.slug)}">Read</a><a ${view === 'source' ? 'class="sel" aria-current="page"' : ''} href="${href(a.slug + '~source')}">View source</a></nav>
      </div>`;
  }
  function catlinks(a) {
    const c = classOf(a.cls);
    const stub = a.stubType ? (a.stubType.match(/^Irad-(\w+)-stub$/i) || [])[1] : null;
    return `<div class="catlinks"><a href="#Special.All">Categories</a>: <ul>
      <li><a href="#Category.${categorySlug(a.category)}">${esc(a.category)}</a></li>
      <li><a href="#Class.${a.cls}">${esc(c ? c.name : a.cls)}</a></li>
      <li><a href="#Subject.${categorySlug(subjectOf(a.category))}">Portal: ${esc(subjectOf(a.category))}</a></li>
      ${stub ? `<li>${esc(stub[0].toUpperCase() + stub.slice(1))} stubs</li>` : ''}
    </ul></div>`;
  }

  /* ---------- images ---------- */
  const imagesFor = a => images.filter(e => e.article === a.title);
  function thumbImg(e) {
    const stem = e.file.replace(/\.svg$/i, '');
    const isSvg = /\.svg$/i.test(e.file);
    const src = isSvg ? `${IMAGES}thumb/${e.width}px-${stem}.png` : IMAGES + e.file;
    const srcset = isSvg ? ` srcset="${IMAGES}thumb/${e.width * 2}px-${stem}.png 2x"` : '';
    return `<a href="${IMAGES}${encodeURI(e.file)}" target="_blank" rel="noopener" title="Open the full-size image"><img src="${src}"${srcset} width="${e.width}" alt="${esc(e.alt || e.caption || '')}" loading="lazy"></a>`;
  }
  // Puts each image after its section heading (and after a "Main article" note, as Wikipedia does).
  // "placement": "lead" puts it at the top right of the article instead, as for a company logo.
  function placeImages(body, a) {
    for (const e of imagesFor(a).filter(x => x.placement === 'lead').reverse()) {
      const fig = document.createElement('figure');
      fig.className = 'thumb lead';
      fig.style.width = (e.width + 8) + 'px';
      fig.innerHTML = thumbImg(e) + (e.caption ? `<figcaption>${esc(e.caption)}</figcaption>` : '');
      // After any hatnotes at the top, before the first paragraph.
      let at = null;
      for (const el of body.children) { if (el.classList.contains('hatnote')) at = el; else break; }
      if (at) at.after(fig); else body.prepend(fig);
    }
    for (const e of imagesFor(a)) {
      if (!e.section) continue;
      const h = [...body.querySelectorAll('h2, h3, h4')].find(x => x.textContent.trim() === e.section);
      if (!h) { console.warn(`Irad Wiki: no section "${e.section}" in ${a.title} for ${e.file}`); continue; }
      const fig = document.createElement('figure');
      fig.className = 'thumb';
      fig.style.width = (e.width + 8) + 'px';
      fig.innerHTML = thumbImg(e) + (e.caption ? `<figcaption>${esc(e.caption)}</figcaption>` : '');
      let at = h;
      const next = h.nextElementSibling;
      if (next && /^Main articles?:/i.test(next.textContent.trim())) at = next;
      at.after(fig);
    }
  }

  function renderArticle(a) {
    const body = document.createElement('div');
    body.className = 'prose';
    body.innerHTML = toHtml(a.src);
    enhance(body);
    placeImages(body, a);
    const hs = [...body.querySelectorAll('h2')];
    hs.forEach((h, i) => { h.id = 'sec-' + (i + 1); });
    if (hs.length >= 2) {
      const t = document.createElement('details');
      t.className = 'inline-toc';
      t.innerHTML = `<summary>Contents</summary><ol>${hs.map(h => `<li><a href="#" data-to="${h.id}">${esc(h.textContent)}</a></li>`).join('')}</ol>`;
      t.addEventListener('click', e => { const l = e.target.closest('a[data-to]'); if (l) { e.preventDefault(); document.getElementById(l.dataset.to)?.scrollIntoView(); } });
      hs[0].before(t);
    }
    if (a.slug === 'Irad' && infobox) body.prepend(renderInfobox(infobox));

    const back = [...(wiki.backlinks.get(a.slug) || [])].sort(byTitle);
    main.innerHTML = `
      <article>
        ${articleHead(a, 'read')}
        <div class="siteSub">From Irad Wiki, the free encyclopedia</div>
        <div id="body"></div>
        ${back.length ? `<details class="backlinks"><summary>What links here (${back.length})</summary><ul>${back.map(b => `<li><a href="${href(b.slug)}">${esc(b.title)}</a></li>`).join('')}</ul></details>` : ''}
        ${catlinks(a)}
      </article>`;
    $('#body').replaceWith(body);
    renderToc(hs.map(h => ({ id: h.id, text: h.textContent })));
    return a.title;
  }

  function renderSource(a) {
    const vol = VOLUMES[a.vol];
    main.innerHTML = `
      ${articleHead(a, 'source')}
      <div class="siteSub">From Irad Wiki, the free encyclopedia</div>
      <p class="source-note">This article's text is in <code>${esc(vol.file)}</code>, under the heading on line ${a.line}${a.number ? ` (§${esc(a.number)})` : ''}. To change it, edit that file.</p>
      <pre class="source-view">${esc(a.src)}</pre>
      <p><a href="${href(a.slug)}">Return to ${esc(a.title)}.</a></p>`;
    return `View source for ${a.title}`;
  }

  function linkNames(text) {
    // Links values in the infobox that are exactly an article title, e.g. "Talas".
    return esc(text).replace(/^([^(;,]+?)(\s*\(|$)/, (m, name, rest) => {
      const t = resolve(wiki, name.trim());
      return t ? `<a href="${href(t.slug)}">${esc(name)}</a>${rest}` : m;
    });
  }

  function renderInfobox(box) {
    const el = document.createElement('aside');
    el.className = 'infobox';
    const flag = box.rows.find(r => r.key === 'Flag');
    const locator = images.find(e => e.article === 'Irad' && e.placement === 'infobox');
    const rows = box.rows.filter(r => r !== flag);
    // As on Wikipedia, the location map sits after the flag and anthem, before the capital and the rest.
    const anthemAt = rows.findIndex(r => /^anthem/i.test(r.key));
    const top = rows.slice(0, anthemAt + 1), rest = rows.slice(anthemAt + 1);
    const dl = list => list.length ? `<dl>${list.map(r => `<dt>${esc(r.key)}</dt><dd>${r.value ? linkNames(r.value) : ''}${r.items.length ? `<ul>${r.items.map(i => `<li>${i.label ? `${esc(i.label)}: ` : ''}${linkNames(i.value)}</li>`).join('')}</ul>` : ''}</dd>`).join('')}</dl>` : '';
    el.innerHTML = `
      <div class="above">${esc(box.name)}${box.subtitle ? `<span>${esc(box.subtitle)}</span>` : ''}</div>
      <figure><img src="${FLAG}" alt="Flag of Irad">${flag ? `<figcaption>Flag: ${esc(flag.value)}</figcaption>` : ''}</figure>
      ${dl(top)}
      ${locator ? `<figure class="locator">${thumbImg(locator)}${locator.caption ? `<figcaption>${esc(locator.caption)}</figcaption>` : ''}</figure>` : ''}
      ${dl(rest)}`;
    return el;
  }

  function renderMissing(key) {
    const t = key.replace(/_/g, ' ');
    main.innerHTML = `
      <div class="title-row"><h1 class="firstHeading">${esc(t)}</h1></div>
      <div class="siteSub">From Irad Wiki, the free encyclopedia</div>
      <div class="cat-intro"><p><b>Irad Wiki does not have an article with this exact name.</b> Please <a href="#Special.Search" id="searchFor">search for <i>${esc(t)}</i> in Irad Wiki</a> to check for alternative titles or spellings.</p></div>`;
    $('#searchFor').addEventListener('click', () => { query = t; });
    return t;
  }

  /* ---------- category-style lists ---------- */
  function letterOf(title) {
    const L = (fold(sortKey(title))[0] || '#').toUpperCase();
    return /[A-Z]/.test(L) ? L : '#';
  }
  function pagesColumns(list) {
    const groups = new Map();
    [...list].sort(byTitle).forEach(a => { const L = letterOf(a.title); if (!groups.has(L)) groups.set(L, []); groups.get(L).push(a); });
    return `<div class="cat-cols">${[...groups].map(([L, as]) => `<div><h3>${L}</h3><ul>${as.map(a => `<li><a href="${href(a.slug)}">${esc(a.title)}</a></li>`).join('')}</ul></div>`).join('')}</div>`;
  }
  function listPage(title, intro, list, subcats) {
    main.innerHTML = `
      <div class="title-row"><h1 class="firstHeading">${esc(title)}</h1></div>
      <div class="tabs"><nav><a class="sel" href="${href(current)}">${title.startsWith('Portal:') ? 'Portal' : 'Category'}</a></nav><nav><a class="sel" href="${href(current)}">Read</a></nav></div>
      <div class="siteSub">From Irad Wiki, the free encyclopedia</div>
      ${intro ? `<div class="cat-intro">${intro}</div>` : ''}
      ${subcats ? `<h2 class="cat-h2">Categories</h2><p>This portal has the following ${plural(subcats.length, 'category', 'categories')}.</p><ul class="subcats">${subcats.map(([c, l]) => `<li><a href="#Category.${categorySlug(c)}">${esc(c)}</a> <small>(${l.length} P)</small></li>`).join('')}</ul>` : ''}
      <h2 class="cat-h2">Pages in ${subcats ? 'this portal' : `category "${esc(title.replace(/^Category:/, ''))}"`}</h2>
      <p>The following ${plural(list.length, 'page is', 'pages are')} in this ${subcats ? 'portal' : 'category'}, out of ${list.length.toLocaleString('en')} total.</p>
      ${pagesColumns(list)}`;
    return title;
  }
  function renderClass(id) {
    const c = classOf(id);
    return listPage(`Category:${c.name[0].toUpperCase() + c.name.slice(1)}`, `<p>${esc(c.blurb)}</p>`, wiki.articles.filter(a => a.cls === id));
  }
  function renderCategory(cat) {
    const s = subjectOf(cat);
    return listPage(`Category:${cat}`, `<p>Part of the <a href="#Subject.${categorySlug(s)}">${esc(s)}</a> portal.</p>`, wiki.categories.get(cat));
  }
  function renderSubject(s) {
    const cats = [...wiki.subjects.get(s)].sort((a, b) => b[1].length - a[1].length);
    return listPage(`Portal:${s}`, `<p>Articles on ${esc(s.toLowerCase())} in Irad, grouped from ${plural(cats.length, 'category', 'categories')}.</p>`, cats.flatMap(([, l]) => l), cats);
  }

  function renderIndex() {
    const groups = new Map();
    for (const a of wiki.sorted) { const L = letterOf(a.title); if (!groups.has(L)) groups.set(L, []); groups.get(L).push(a); }
    main.innerHTML = `
      <div class="title-row"><h1 class="firstHeading">All pages</h1></div>
      <div class="siteSub">From Irad Wiki, the free encyclopedia</div>
      <p class="cat-intro">Every article in Irad Wiki, ${wiki.articles.length.toLocaleString('en')} in total.</p>
      <div class="az-letters">${[...groups.keys()].map(L => `<button type="button" data-to="L-${L}">${L}</button>`).join('')}</div>
      ${[...groups].map(([L, list]) => `<h2 class="cat-h2 az-h" id="L-${L}">${L}</h2><div class="cat-cols"><ul>${list.map(a => `<li><a href="${href(a.slug)}">${esc(a.title)}</a></li>`).join('')}</ul></div>`).join('')}`;
    main.querySelector('.az-letters').addEventListener('click', e => {
      const b = e.target.closest('button'); if (b) document.getElementById(b.dataset.to)?.scrollIntoView();
    });
    return 'All pages';
  }

  /* ---------- search ---------- */
  function titleMatches(q, limit) {
    const f = fold(q.trim());
    if (!f) return [];
    const starts = [], words = [], contains = [];
    for (const a of wiki.sorted) {
      const t = fold(a.title);
      if (t.startsWith(f)) starts.push(a);
      else if (t.includes(' ' + f) || t.includes('(' + f) || t.includes('-' + f)) words.push(a);
      else if (t.includes(f)) contains.push(a);
    }
    return [...starts, ...words, ...contains].slice(0, limit);
  }
  function buildSearchIndex() {
    searchIndex = wiki.articles.map(a => { const text = plainText(a.src); return { a, text, f: fold(text), words: text.split(/\s+/).length }; });
  }

  function renderSearch() {
    if (!searchIndex) buildSearchIndex();
    const q = query.trim();
    const form = `<form class="search-big" id="bigSearch" role="search"><input id="q2" type="search" value="${esc(q)}" aria-label="Search Irad Wiki"><button type="submit">Search</button></form>`;
    const head = `<div class="title-row"><h1 class="firstHeading">Search results</h1></div>${form}`;
    const bind = () => $('#bigSearch').addEventListener('submit', e => { e.preventDefault(); query = $('#q2').value.trim(); route(); });
    if (!q) { main.innerHTML = head; bind(); return 'Search'; }
    const f = fold(q);
    const titleHits = new Set(titleMatches(q, 50));
    const results = [];
    for (const e of searchIndex) {
      const i = e.f.indexOf(f);
      if (i < 0 && !titleHits.has(e.a)) continue;
      let n = 0, p = i;
      while (p >= 0 && n < 50) { n++; p = e.f.indexOf(f, p + f.length); }
      results.push({ e, i, score: (titleHits.has(e.a) ? 1000 : 0) + (fold(e.a.title) === f ? 1000 : 0) + n });
    }
    results.sort((x, y) => y.score - x.score || byTitle(x.e.a, y.e.a));
    const exact = wiki.byFold.get(f);
    const snip = ({ e, i }) => {
      if (i < 0) return esc(ledeOf(e.a));
      const s = Math.max(0, e.text.lastIndexOf(' ', Math.max(0, i - 80)));
      const end = Math.min(e.text.length, i + f.length + 120);
      // fold() keeps string length for these scripts, so the indexes line up
      return `${s > 0 ? '… ' : ''}${esc(e.text.slice(s, i).trimStart())}<span class="searchmatch">${esc(e.text.slice(i, i + f.length))}</span>${esc(e.text.slice(i + f.length, end))}${end < e.text.length ? ' …' : ''}`;
    };
    const kb = e => Math.max(1, Math.round(e.a.src.length / 1024));
    main.innerHTML = `${head}
      ${exact ? `<p><b>There is a page named "<a href="${href(exact.slug)}">${esc(exact.title)}</a>" on Irad Wiki</b></p>` : ''}
      <div class="r-count">${results.length ? `Results 1 – ${Math.min(results.length, 100)} of ${results.length.toLocaleString('en')}` : `There were no results matching the query "${esc(q)}".`}</div>
      <ul class="results">${results.slice(0, 100).map(r => `
        <li><div class="r-title"><a href="${href(r.e.a.slug)}">${esc(r.e.a.title)}</a></div>
        <div class="r-snip">${snip(r)}</div>
        <div class="r-data">${kb(r.e)} KB (${r.e.words.toLocaleString('en')} words) · ${esc(classOf(r.e.a.cls)?.short || '')}</div></li>`).join('')}</ul>
      ${results.length > 100 ? `<p class="r-data">Only the first 100 results are shown. Add another word to narrow the search.</p>` : ''}`;
    bind();
    return `Search results for "${q}"`;
  }

  const input = $('#q'), sug = $('#suggest');
  let sel = -1;
  function closeSuggest() { sug.hidden = true; sel = -1; input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); }
  function openSuggest() {
    if (!wiki) return;
    const q = input.value.trim();
    if (!q) return closeSuggest();
    const hits = titleMatches(q, 8);
    sug.innerHTML = hits.map((a, i) => `<li role="option" id="opt${i}"><a href="${href(a.slug)}"><b>${esc(a.title)}</b><small>${esc(ledeOf(a))}</small></a></li>`).join('')
      + `<li class="all" role="option" id="opt${hits.length}"><a href="#Special.Search" data-search="1">${ICON.search}<span>Search for pages containing <b>${esc(q)}</b></span></a></li>`;
    sug.hidden = false; sel = -1; input.setAttribute('aria-expanded', 'true');
  }
  input.addEventListener('input', openSuggest);
  input.addEventListener('focus', openSuggest);
  input.addEventListener('keydown', e => {
    const items = [...sug.querySelectorAll('li')];
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !sug.hidden) {
      e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((li, i) => li.classList.toggle('on', i === sel));
      input.setAttribute('aria-activedescendant', items[sel].id);
    }
  });
  $('#searchForm').addEventListener('submit', e => {
    e.preventDefault();
    const items = [...sug.querySelectorAll('li')];
    if (!sug.hidden && sel >= 0 && items[sel] && !items[sel].classList.contains('all')) { items[sel].querySelector('a').click(); return; }
    const q = input.value.trim();
    if (!q || !wiki) return;
    const exact = wiki.byFold.get(fold(q));
    closeSuggest(); input.blur(); input.value = '';
    byClick = true;
    if (exact) { location.hash = href(exact.slug); return; }   // Wikipedia's "Go" behaviour
    runSearch(q);
  });
  sug.addEventListener('mousedown', e => e.preventDefault());
  sug.addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    if (a.dataset.search) { e.preventDefault(); const q = input.value.trim(); input.value = ''; closeSuggest(); input.blur(); runSearch(q); return; }
    input.value = ''; closeSuggest(); input.blur();
  });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) closeSuggest(); });
  function runSearch(q) {
    query = q;
    byClick = true;
    if (location.hash === '#Special.Search') route(); else location.hash = 'Special.Search';
  }

  /* ---------- main page ---------- */
  function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // Turns "X is a …." into "… that X is a …?" for the Did you know box.
  function dykFact(a) {
    const para = a.src.split(/\n\s*\n/).find(p => p.trim() && !/^\s*[#<{|]/.test(p));
    if (!para) return null;
    const text = plainText(para);
    const first = text.split(/(?<=[a-z0-9\)”"'][.!?])\s+(?=[A-Z“"])/)[0] || '';
    if (!fold(first).startsWith(fold(a.title)) || first.length > 230 || first.length < 40) return null;
    const rest = first.slice(a.title.length).replace(/\s*\(see [^()]*(\([^()]*\))?[^()]*\)/g, '').replace(/[.!]$/, '');
    if (!/^\s*(\(|,|is|was|are|were|has|had)/.test(rest)) return null;
    return `… that <b><a href="${href(a.slug)}">${esc(a.title)}</a></b>${esc(rest)}?`;
  }

  function renderHome() {
    const fa = wiki.articles.find(a => a.cls === 'FA');
    const firstPara = fa ? fa.src.split(/\n\s*\n/).find(p => p.trim() && !/^\s*[#<{|]/.test(p)) : '';
    const facts = [];
    for (const a of shuffle(wiki.articles.filter(a => a.cls === 'Start' || a.cls === 'Stub'))) {
      const f = dykFact(a);
      if (f) facts.push(f);
      if (facts.length === 6) break;
    }
    const ga = wiki.articles.filter(a => a.cls === 'GA').sort(byTitle);
    const recent = wiki.articles.filter(a => a.cls === 'B').sort(byTitle);
    const recentPick = shuffle(recent).slice(0, 3).sort(byTitle);

    main.innerHTML = `
      <h1 class="sr-only">Main Page</h1>
      <div class="mp-welcome">
        <div class="hello">Welcome to <a href="#Irad">Irad Wiki</a>,</div>
        <p>the free encyclopedia of Iradistan.</p>
        <p><a href="#Special.All">${wiki.articles.length.toLocaleString('en')}</a> articles in English</p>
      </div>
      <div class="mp-grid">
        <div class="mp-col">
          <section class="mp-box mp-green">
            <h2>From today's featured article</h2>
            ${fa ? `<div class="mp-tfa"><a href="${href(fa.slug)}"><img src="${FLAG}" alt="Flag of Irad"></a><div id="tfaText"></div><p><b>(<a href="${href(fa.slug)}">Full article…</a>)</b></p></div>
            <p class="recent">Recently featured: ${recentPick.map(a => `<a href="${href(a.slug)}">${esc(a.title)}</a>`).join(' – ')}</p>
            <div class="mp-more"><a href="#Class.FA">Featured articles</a> · <a href="#Class.GA">Good articles</a></div>` : ''}
          </section>
          <section class="mp-box mp-green">
            <h2>Did you know …</h2>
            <ul>${facts.map(f => `<li>${f}</li>`).join('')}</ul>
            <div class="mp-more"><a href="#" id="moreDyk">More facts</a> · <a href="#Special.Random">Random article</a></div>
          </section>
        </div>
        <div class="mp-col">
          <section class="mp-box mp-blue">
            <h2>Good articles</h2>
            <ul>${ga.map(a => `<li><a href="${href(a.slug)}">${esc(a.title)}</a>: ${esc(ledeOf(a).replace(new RegExp('^' + a.title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*'), '').slice(0, 110).replace(/\s+\S*$/, ''))}…</li>`).join('')}</ul>
          </section>
          <section class="mp-box mp-blue">
            <h2>Articles by quality</h2>
            <ul class="mp-classes">${CLASSES.map(c => `<li>${ICON[c.id] || ICON.dot}<a href="#Class.${c.id}">${esc(c.name)}</a><span class="n">${classCount(c.id)}</span></li>`).join('')}</ul>
          </section>
        </div>
      </div>
      <section class="mp-box mp-purple">
        <h2>Irad Wiki portals</h2>
        <div class="mp-subjects">${wiki.subjectOrder.map(s => {
          const cats = [...wiki.subjects.get(s)].sort((a, b) => b[1].length - a[1].length);
          return `<div><h3><a href="#Subject.${categorySlug(s)}">${esc(s)}</a></h3><p>${cats.slice(0, 4).map(([c]) => `<a href="#Category.${categorySlug(c)}">${esc(c)}</a>`).join(' · ')}${cats.length > 4 ? ` · <a href="#Subject.${categorySlug(s)}">more…</a>` : ''}</p></div>`;
        }).join('')}</div>
      </section>
      <div class="mp-other">
        <h2>Other areas of Irad Wiki</h2>
        <ul>
          <li><b><a href="#Special.All">All pages</a></b> – every article in the encyclopedia, A to Z.</li>
          <li><b><a href="#Special.Random">Random article</a></b> – open an article picked at random.</li>
          <li><b><a href="#Class.Stub">Stubs</a></b> – short articles waiting to be expanded.</li>
          <li><b><a href="#Irad">Irad</a></b> – the country article, with the national infobox.</li>
        </ul>
      </div>`;
    if (fa && firstPara) {
      const p = $('#tfaText');
      p.innerHTML = toHtml(firstPara);
      p.querySelectorAll('sup').forEach(s => s.remove());
    }
    $('#moreDyk').addEventListener('click', e => { e.preventDefault(); const y = scrollY; renderHome(); scrollTo(0, y); });
    return '';
  }

  /* ---------- footer ---------- */
  function renderFooter(a) {
    const vol = a ? VOLUMES[a.vol] : null;
    foot.innerHTML = `
      ${a ? `<p>This article is from ${esc(vol.label)} of the Irad Wiki (<code>${esc(vol.file)}</code>${a.number ? `, §${esc(a.number)}` : ''}, line ${a.line}).</p>` : ''}
      <p>Irad Wiki is compiled from the ${VOLUMES.length} Irad Wiki volumes: ${wiki.articles.length.toLocaleString('en')} articles in ${wiki.categories.size} categories.</p>
      <ul><li><a href="#">Main page</a></li><li><a href="#Special.All">All pages</a></li><li><a href="#Special.Random">Random article</a></li><li><a href="#Class.FA">Featured articles</a></li></ul>`;
  }

  load();
})();

</script>

</body>
</html>
