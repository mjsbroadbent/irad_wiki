<title>Irad Wiki</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script>
  // GitHub Pages serves this for any address that isn't a file. Articles
  // have pages at irad.wiki/wiki/Name; anything else that looks like a name
  // (irad.wiki/Talas, a missing article, a trailing slash) goes to
  // irad.wiki/#Name, where the app opens the article or says it doesn't exist.
  // Anything that can't be an article name goes to the main page.
  (function () {
    var p = location.pathname.replace(/^\/(wiki\/)?/, '').replace(/\/$/, '');
    var target = '/';
    if (p && !/[\/.]/.test(p)) target = '/#' + p + location.search;
    location.replace(target);
  })();
</script>

  body { font: 16px/1.5 sans-serif; color: #202122; max-width: 520px; margin: 12vh auto; padding: 0 20px; text-align: center; }

</style>
